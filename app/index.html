<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PBA 선수 비교</title>
<style>
:root {
  --bg: #f3f4f6; --panel: #ffffff; --ink: #1c2330; --sub: #6b7280; --line: #e3e6eb; --head: #0f2a4f;
  --accent: #1d5fd1; --win: #1a8f4c; --lose: #c4372f; --heat: 29, 95, 209; --gold: #c99a06; --silver: #8a94a3; --bronze: #b4693a;
  --zebra: #fafbfc; --chip: #eef2f8; --sticky: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1117; --panel: #161b22; --ink: #e6e9ee; --sub: #9aa4b2; --line: #2a313c; --head: #0a1d38;
    --accent: #6ea2ff; --win: #45c27c; --lose: #ff7a70; --heat: 110, 162, 255; --zebra: #1a2029; --chip: #222a36; --sticky: #161b22; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; display: flex; flex-direction: column; }
header.top { background: var(--head); color: #fff; padding: 8px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
header.top h1 { font-size: 16px; margin: 0; letter-spacing: .02em; white-space: nowrap; }
/* 경기 수 · 업데이트 시각은 머리줄 오른쪽 끝 작은 두 줄 (버튼 줄 높이 안에) */
header.top .meta { font-size: 10.5px; line-height: 1.25; opacity: .7; margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; white-space: nowrap; }
#sheetSlot:empty { display: none; }
/* 좁은 창(절반 화면): 제목을 빼고 버튼 글자를 줄여 탭 · 버튼 · 기록지가 한 줄에 들어가게. [ ] 로 감싼 글자(.hl)는 숨김 */
.hl { display: inline; }
@media (max-width: 1100px) {
  header.top { padding: 6px 10px; gap: 6px; } header.top h1 { display: none; }
  .apptabs button { padding: 4px 10px; } header.top .bcbtn { padding: 4px 8px; font-size: 12px; } .hl { display: none; }
  /* 경기 수 · 업데이트 문구는 ⓘ 하나로 (마우스를 올리면 전체 문구) */
  header.top .meta span { display: none; } header.top .meta::before { content: "ⓘ"; font-size: 15px; cursor: help; }
}
/* 640~760 절반 화면: 버튼 안쪽 여백을 더 줄여 팀리그 버튼(팀 순위 · 선수 순위 · 퍼펙트큐)도 한 줄에 */
@media (max-width: 760px) {
  .apptabs button { padding: 4px 7px; } header.top .hbtns { gap: 3px; } header.top .hbtns button { padding: 4px 6px; }
  header.top .bcbtn, header.top #sheetSlot .sheetbtn { padding: 4px 6px; }
}
#h2h, #th2h { background: var(--panel); border-bottom: 1px solid var(--line); }
#h2h:empty, #th2h:empty { display: none; }
#h2h summary, #th2h summary { cursor: pointer; padding: 10px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; list-style: none; }
#h2h summary::-webkit-details-marker, #th2h summary::-webkit-details-marker { display: none; }
/* 상대 전적 줄은 한 줄로: 항목은 줄바꿈 없이, '최근' 문구(.rec)만 남는 폭만큼 줄어 … 처리, 펼치기(.unf)는 같은 줄 오른쪽 끝 */
#h2h summary, #th2h summary { flex-wrap: nowrap; white-space: nowrap; }
#h2h summary .rec { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#h2h summary .unf, #th2h summary .unf { flex: none; margin-left: auto; color: var(--sub); }
@media (max-width: 1100px) { #h2h summary, #th2h summary { gap: 9px; padding: 7px 10px; } #h2h .vs, #th2h .vs { font-size: 14px; } #h2h .big, #th2h .big { font-size: 17px; } }
#h2h .vs, #th2h .vs { font-weight: 700; font-size: 15px; }
#h2h .big, #th2h .big { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
#h2h .body, #th2h .body { max-height: 45vh; overflow: auto; padding: 0 16px 12px; }
.panes { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); min-height: 0; }
.pane { background: var(--bg); overflow: auto; min-width: 0; position: relative; }
/* 선수 검색 줄: 납작하게 (예전 58px → 약 2/3) */
.pane .search { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 6px 10px; border-bottom: 1px solid var(--line); }
.search input { width: 100%; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 14px; }
.suggest { position: absolute; left: 12px; right: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15); max-height: 360px; overflow: auto; }
.suggest div { padding: 8px 12px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
.suggest div:hover, .suggest div.on { background: var(--chip); }
.suggest small { color: var(--sub); }
.empty { color: var(--sub); padding: 40px 20px; text-align: center; }
.card { background: var(--panel); margin: 10px 12px; border-radius: 10px; border: 1px solid var(--line); }
.profile { display: flex; flex-wrap: nowrap; gap: 12px; padding: 14px; align-items: flex-start; }
/* 이름 오른쪽 칸: 시즌 상금·포인트 순위, 누적 상금 순위 + 이번 시즌 대회별 성적. 칸이 좁으면 이름 아래로 내려간다 */
/* 왼쪽: 사진·이름 + 그 아래 필수 정보(남는 폭을 꽉 채움), 오른쪽: 순위 표(제 폭만) */
.pleft { flex: 1 1 0; min-width: 240px; display: flex; flex-direction: column; gap: 8px; }
.pid { display: flex; flex-wrap: nowrap; gap: 8px; align-items: flex-start; } .profile .who { white-space: nowrap; }
.pid > div:not(.rkchip) { min-width: 0; } .pid .rkchip { flex: none; }   /* 순위 칩은 항상 이름 옆 (이름 칸이 줄어듦) */
.pid h2, .pid .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pid > div.rkcol { flex: none; min-width: auto; margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; } .rkcol .mybtn { margin-left: 0; }   /* 맞춤요약 버튼: 순위 칩 아래 오른쪽 (이름이 잘리지 않게) */
.pid .modes { flex-wrap: nowrap; white-space: nowrap; }   /* 짧은 이름(내 시즌·리그 평균)으로 한 줄 */
.pid .who + .who { font-size: 11px; letter-spacing: -.2px; }   /* 생년월일·만 나이 줄은 조금 작게 (잘리지 않게) */
.rkchip .rkh, .rkchip .rkg { justify-content: center; text-align: center; } .rkchip .rkg > div { align-items: center; }
@container (max-width: 360px) { .pid { flex-wrap: wrap; } }
.pid .who { font-size: 12.5px; line-height: 1.3; } .pid .who + .who { margin-top: 0; } .pid .modes { margin-top: 5px; }
/* 이번 시즌 상금·포인트 순위 칩 (이름과 순위 표 사이) */
.rkchip { margin-left: auto; background: var(--chip); border-radius: 8px; padding: 6px 10px; line-height: 1.25; }
.rkchip .rkh { font-size: 11.5px; color: var(--sub); font-weight: 600; white-space: nowrap; } .rkchip .rkh small { font-size: 10px; font-weight: 500; }
.rkchip .rkg { display: flex; align-items: flex-start; gap: 6px; margin-top: 2px; }
.rkchip .rkg > div { display: flex; flex-direction: column; } .rkchip .rkg i { font-style: normal; color: var(--sub); font-size: 15px; line-height: 21px; }
.rkchip .rkg b { font-size: 17px; font-weight: 800; white-space: nowrap; } .rkchip .rkg span { font-size: 11.5px; color: var(--sub); font-weight: 600; white-space: nowrap; }
/* '기본 기록' 제목 오른쪽 D-day */
.pleft .mtitle { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .pleft .mtitle .ddays { margin-top: 0; font-weight: 400; }
/* 선수 기록 질문 (이름 옆 🔍) */
.pcol { position: relative; flex: none; line-height: 0; }
.qabtn { position: absolute; right: 2px; bottom: 2px; font-size: 12px; line-height: 1; padding: 3px 4px; border-radius: 6px; border: 1px solid var(--line); background: rgba(20, 24, 32, .75); cursor: pointer; }
.qabtn.on, .qabtn:hover { border-color: var(--accent); background: rgba(var(--heat), .15); }
.card { position: relative; }
.qa { position: absolute; left: 10px; right: 10px; z-index: 40; padding: 10px; border: 1px solid var(--accent); border-radius: 10px; background: var(--panel); box-shadow: 0 12px 34px rgba(0, 0, 0, .45); max-height: 70vh; overflow: auto; }
.qa::before { content: ''; position: absolute; top: -7px; left: 40px; width: 12px; height: 12px; background: var(--panel); border-left: 1px solid var(--accent); border-top: 1px solid var(--accent); transform: rotate(45deg); }
table.qatab .qseq { letter-spacing: 1px; font-size: 11px; } table.qatab .qseq .w, table.qatab .qseq .l { font-weight: 700; }
.qaf { display: flex; gap: 6px; } .qaf input { flex: 1; min-width: 0; padding: 7px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 13px; }
.qaf button { padding: 6px 12px; border-radius: 7px; border: 0; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
.qaex { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; }
.qaex button, .qahelp button { font-size: 11px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--sub); cursor: pointer; margin: 2px; }
.qaex button:hover, .qahelp button:hover { color: var(--ink); border-color: var(--accent); }
.qacats button { font-weight: 600; color: var(--ink); }
.qacats button.on { border-color: var(--accent); background: rgba(var(--heat), .15); }
.qasub { margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--line); } .qasub > b { font-size: 11px; color: var(--sub); margin: 0 4px 0 2px; }
.parts { display: flex; flex-wrap: wrap; gap: 3px; padding: 2px 14px 8px; } .popbody > .parts { padding: 0 0 8px; }
.parts button { font-size: 11.5px; padding: 2px 9px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--sub); cursor: pointer; }
.parts .pswitch { position: relative; width: 46px; height: 20px; padding: 0 !important; border-radius: 10px !important; border: 1px solid var(--line); background: var(--chip) !important; cursor: pointer; flex: none; align-self: center; } .parts .pswitch i { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--sub); transition: left .15s, background .15s; }
.parts .pswitch::after { content: "OFF"; position: absolute; right: 6px; top: 0; line-height: 18px; font-size: 9px; font-weight: 800; letter-spacing: .3px; color: var(--sub); }
.parts .pswitch.on { border-color: var(--accent); background: var(--accent) !important; } .parts .pswitch.on i { left: 28px; background: #fff; } .parts .pswitch.on::after { content: "ON"; right: auto; left: 8px; color: #fff; }   /* 키워드 모두 켜기 · 끄기 스위치 (키워드 줄 맨 앞) */
/* 세부 칩 머리줄: 이름 · 내 시즌/리그 평균 · 키워드 · 최신부터 · 모두 끄기/켜기 · ✕ (키워드 줄은 머리줄 안에 풀어 놓는다) */
.sechead > .parts.phead { display: contents; }
.sechead > b, .sechead > .fbtn { order: 0; } .sechead > .bcseg { order: 1; } .sechead > .parts.phead > * { order: 2; } .sechead > .ordbtn { order: 3; } .sechead:has(> .parts.phead) > .ordbtn { margin-left: 0; } .sechead > .secx, .sechead > .ordbtn + .secx { order: 5; margin-left: auto; }
.sechead > .parts.phead > .pup { font-size: 11px; font-weight: 700; color: var(--sub); margin-left: 4px; align-self: center; white-space: nowrap; }   /* 안쪽 키워드 묶음 꼬리표 '세트 흐름 ›' */
.sechead > .parts.phead button:not(.secx) { font-size: 11.5px; padding: 2px 9px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--sub); cursor: pointer; }
.sechead > .parts.phead button.on { color: var(--ink); font-weight: 600; border-color: var(--accent); background: rgba(var(--heat), .15); }
/* 서로 독립인 키워드 내용은 테두리 상자 (안쪽 테두리와 바깥 테두리 사이 간격은 7px, 겹친 상자 규칙) */
.pbox { border: 1px solid var(--line); border-radius: 8px; margin: 0 7px 7px; padding: 7px 0 2px; } .pbox > .subhead:first-child { margin-top: 0 !important; }
[data-psub] > .parts { padding-top: 0; } [data-psub] > .parts button:not(.pswitch) { font-size: 11px; padding: 1px 8px; }   /* 안쪽(2단) 키워드 줄은 조금 작게 */
/* 세트 스코어 분포 표 · 그래프 (distViewBtns) */
html[data-dview="chart"] .dv-t, html:not([data-dview="chart"]) .dv-c { display: none !important; }
.subhead .dview { margin-left: 8px; vertical-align: middle; } .subhead .dview button { padding: 1px 9px; font-size: 11.5px; }
.dvrow { padding: 0 14px 6px; } .dvrow .bcseg button { padding: 1px 9px; font-size: 11.5px; }
.dv-c { padding: 2px 14px 8px; } .dleg { display: flex; gap: 12px; font-size: 11.5px; color: var(--sub); margin-bottom: 4px; } .dleg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.dc0 { background: var(--accent); } .dc1 { background: #d4a72c; }
.dgrp { margin-bottom: 8px; } .dgt { font-size: 12px; font-weight: 700; color: var(--sub); margin: 4px 0 3px; }
.drow { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); align-items: center; gap: 6px; padding: 2px 0; border-bottom: 1px solid var(--line); } .drow > b { font-size: 13px; text-align: center; }
.dbars { display: flex; flex-direction: column; gap: 2px; } .dbar { display: grid; grid-template-columns: minmax(0, 1fr) 6.8em; align-items: center; gap: 6px; height: 13px; }
.dbar i { display: block; height: 100%; border-radius: 0 3px 3px 0; min-width: 1px; } .dbar span { font-size: 11.5px; font-weight: 600; white-space: nowrap; } .dbar small { font-weight: 400; color: var(--sub); font-size: 10.5px; }
.parts button:hover { color: var(--ink); border-color: var(--accent); } .parts button.on { color: var(--ink); font-weight: 600; border-color: var(--accent); background: rgba(var(--heat), .15); }
.qaout:empty { display: none; } .qaout { margin-top: 8px; }
.qahead { font-size: 12px; color: var(--sub); margin-bottom: 3px; } .qahead b { color: var(--ink); }
.qasum { font-size: 13.5px; margin-bottom: 6px; line-height: 1.5; } .qahelp { font-size: 12.5px; color: var(--sub); line-height: 1.6; }
table.qatab { font-size: 12px; } table.qatab td { white-space: nowrap; } table.qatab.tbq td { white-space: normal; vertical-align: top; } table.qatab.tbq td:first-child { white-space: nowrap; color: var(--sub); } table.qatab.tbq td small { color: var(--sub); }   /* 승부치기 요약: 대회 · 상대는 줄바꿈 허용 */
/* 앱이 직접 그리는 말풍선 */
.rkbub { position: fixed; z-index: 99; pointer-events: none; background: color-mix(in srgb, var(--panel) 86%, var(--ink) 14%); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1.5px solid color-mix(in srgb, var(--accent) 60%, var(--line)); border-radius: 8px; padding: 5px 7px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .35), 0 10px 30px rgba(0, 0, 0, .55); font-size: 11px; color: var(--ink); }
.rkbub .rkh0 { font-weight: 800; font-size: 11.5px; margin-bottom: 3px; white-space: nowrap; } .rkbub .rkh0 small { color: var(--sub); font-weight: 500; margin-left: 3px; } .rkbub .rsub { font-weight: 600; font-size: 10.5px; color: var(--sub); }
.rkbub .cols { display: flex; gap: 10px; } .rkbub .rh { font-size: 10.5px; font-weight: 700; color: var(--sub); margin-bottom: 1px; }
.rkbub table { border-collapse: collapse; } .rkbub td { padding: 0 3px; line-height: 1.32; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rkbub td:first-child { text-align: right; color: var(--sub); padding-left: 0; } .rkbub td:last-child { text-align: right; font-weight: 700; padding-right: 0; }
.rkbub tr.me td { color: var(--accent); font-weight: 800; border-bottom: 1px solid var(--line); padding-bottom: 2px; } .rkbub tr.me + tr td { padding-top: 2px; }
.rkbub table.rdtip td { padding: 0 5px; text-align: right; } .rkbub table.rdtip td:first-child { text-align: left; color: var(--ink); font-weight: 700; }
.rkbub table.r5t td { white-space: nowrap; } .rkbub table.r5t td:nth-child(3) { text-align: left; } .rkbub table.r5t td small { color: var(--sub); font-weight: 600; } .rkbub table.r5t td.w b { color: var(--win); } .rkbub table.r5t td.l b { color: var(--lose); }   /* 기록지 브리핑 최근 5경기 · 5세트 말풍선 */
.rkbub table.gflow td { white-space: nowrap; } .rkbub table.gflow td:nth-child(3) { text-align: right; color: var(--ink); font-weight: 700; } .rkbub table.gflow td:nth-child(5) { text-align: left; color: var(--sub); font-weight: 600; } .rkbub table.gflow td:nth-child(4) { text-align: center; } .rkbub table.gflow td small { color: var(--sub); font-weight: 600; } .rkbub table.gflow tr.hd td { font-size: 10px; color: var(--sub); font-weight: 700; } .rkbub table.gflow tr.w td:nth-child(4) b, .rkbub table.gflow tr.w td.run b { color: var(--win); } .rkbub table.gflow tr.l td:nth-child(4) b, .rkbub table.gflow tr.l td.run b { color: var(--lose); }   /* 팀 이번 라운드 칩: 세트별 라인업 · 승패 경과 */
.rkbub table.rdtip.vs td.tg { text-align: left; color: var(--accent); font-size: 11px; font-weight: 800; padding-top: 5px; border-bottom: 1px solid var(--line); } .rkbub table.rdtip.vs tr:first-child td.tg { padding-top: 0; } .rkbub table.rdtip.vs td.tg small { color: var(--sub); font-weight: 600; } .rkbub table.rdtip.vs td[colspan="2"]:not(.tg) { text-align: left; color: var(--sub); font-weight: 600; }   /* 세트 번호 맞대결 말풍선: 개인투어 · 팀리그 묶음 머리 */
.rkbub tr.mine:not(.me) td { color: var(--accent); font-weight: 800; }
.rkbub table.f5tip td { text-align: left; font-weight: 600; color: var(--ink); } .rkbub table.f5tip td:first-child { color: var(--sub); } .rkbub table.f5tip tr.w b { color: var(--win); } .rkbub table.f5tip tr.l b { color: var(--lose); } .rkbub table.f5sum { margin-bottom: 5px; padding-bottom: 4px; border-bottom: 1px solid var(--line); } .rkbub table.f5sum small { color: var(--sub); font-weight: 500; } .rkbub table.f5sum td { vertical-align: top; padding-right: 10px; } .rkbub table.f5sum td.f5h { color: var(--sub); font-weight: 700; }   /* 끝내기 장타 · 대회별 성적 말풍선 */
.rkbub .rgames { font-size: 10.5px; line-height: 1.4; color: var(--ink); border-bottom: 1px solid var(--line); padding-bottom: 3px; margin-bottom: 3px; white-space: nowrap; }
.tipbox { position: fixed; z-index: 100; max-width: 320px; padding: 5px 9px; border-radius: 7px; background: #1f2633; color: #f1f4f8; font-size: 12px; line-height: 1.45; white-space: pre-line; box-shadow: 0 6px 20px rgba(0, 0, 0, .35); pointer-events: none; }
/* 팀리그 베스트 콤비 한 줄 · 다른 팀 조합 표시 · 남복/여복/혼복 구역 · 세트 흐름 왼쪽 칸 좁게 */

// 평균 대비 차이를 색으로: 잘하면 초록, 못하면 빨강
function vsLeague(v, L, fmt, better) {
  if (v == null || L == null || isNaN(v) || isNaN(L)) return null;
  let d = v - L; if (better === 'low') d = -d;
  const scale = fmt === pct ? 0.12 : Math.max(Math.abs(L) * 0.2, 0.05);
  const a = Math.min(1, Math.abs(d) / scale) * 0.45 + 0.05;
  const raw = v - L;
  const txt = fmt === pct ? `${raw >= 0 ? '+' : ''}${(raw * 100).toFixed(1).replace(/\.0$/, "")}%p` : `${raw >= 0 ? '+' : ''}${raw.toFixed(fmt === f3 ? 3 : fmt === f1 ? 1 : 2)}`;
  return { cls: Math.abs(d) < 1e-9 ? '' : d > 0 ? 'up' : 'down', style: `--a:${a.toFixed(2)}`, txt };
}

// 시즌별 표를 만든다. cols: [{label, games}] (마지막은 통산)
// mode: 'self' = 내 시즌끼리 비교(파랑), 'league' = 리그 평균 대비(초록/빨강). 리그 모드에선 맨 끝에 리그 평균 열.
// 시즌 요약 칸 말풍선: 그 열(시즌 · 통산)의 리그 평균 + 같은 종목 선수 중 순위 (통산 30경기 · 시즌 10경기 이상, 같으면 같은 순위)
function summaryTip(rk, col, i, key, v, better, fmt, hasLg) {
  if (!rk.L || v == null || isNaN(v)) return '';
  const tot = i >= rk.seasons.length, scope = tot ? 'all' : 'season', season = tot ? null : rk.seasons[i];
  const lgv = hasLg && col.league ? col.league[key] : null;
  const list = rankTable(rk.L, scope, season, 'set'), C = list._kv || (list._kv = {});
  if (!C[key]) C[key] = list.map(x => { if (key === 'dominance' && x.o.dominance === undefined) x.o.dominance = dominanceOf(x.o, tot ? rk.L.all : rk.L.season[season]); return [x.id, x.o[key]]; }).filter(([, y]) => y != null && !isNaN(y) && isFinite(y));
  const kv = C[key], me = kv.find(([id]) => id === rk.pid);
  const rank = me ? 1 + kv.filter(([, y]) => better === 'low' ? y < me[1] : y > me[1]).length : null;
  const parts = [];
  if (lgv != null && !isNaN(lgv) && lg50(fmt(lgv))) parts.push(`리그 평균 ${fmt(lgv)}`);
  if (rank) parts.push(`${rank}위 (${kv.length}명 중)`); else if (kv.length) parts.push(`순위 없음 (${RANK_MIN[scope]}경기 미만)`);
  return parts.length ? ` title="${esc(parts.join(' · '))}"` : '';
}
// rk = { L, pid, seasons } 를 주면 숫자 칸 말풍선 = 리그 평균 · 이 선수 순위만 (시즌 요약)
function seasonTable(rows, cols, mode = 'self', rk) {
  const calcs = cols.map(c => ({ ...calc(c.games), ...(c.extra || {}) }));
  calcs.forEach((o, i) => { o.dominance = dominanceOf(o, cols[i].league); ratioStats(o, cols[i].games, cols[i].league); });   // 게임 지배력은 그 열의 리그 평균이 있어야 계산된다
  const lg = mode === 'league' && cols[cols.length - 1].league;
  let h = '<div class="tw"><table class="grid"><thead><tr><th class="lab"></th>';
  cols.forEach((c, i) => h += `<th class="${i === cols.length - 1 ? 'tot' : ''}">${esc(c.label)}</th>`);
  if (lg) h += '<th class="lg">리그 평균</th>';
  h += '</tr></thead><tbody>';
  rows.forEach(([key, name, fmt, desc, sub, better]) => {
    h += `<tr><th class="lab"><abbr title="${esc(desc)}">${esc(name)}</abbr></th>`;
    const vals = calcs.map(o => key === 'wl' ? null : o[key]);
    const season = vals.slice(0, -1).filter(v => v != null && !isNaN(v) && isFinite(v));
    const lo = Math.min(...season), hi = Math.max(...season);
    const isRate = fmt === pct || fmt === f3 || fmt === f2 || fmt === f1;
    calcs.forEach((o, i) => {
      const last = i === cols.length - 1;
      let txt, style = '', cls = last ? 'tot' : '', diff = '';
      if (key === 'wl') txt = o.games || o.ffW || o.ffL ? `${o.win}-${o.lose}${o.ffW || o.ffL ? `<span class="s">${ffText(o.ffW, o.ffL)}</span>` : ''}` : '';
      else txt = fmt(o[key]);
      const v = o[key];
      if (mode === 'league') {
        const L = cols[i].league && cols[i].league[key];
        const c = isRate && !NO_LEAGUE.has(key) && txt ? vsLeague(v, L, fmt, better) : null;
        if (c) { cls += ' ' + c.cls; style = c.style; diff = `<span class="d">${c.txt}</span>`; }
      } else if (!last && isRate && season.length > 1 && v != null && hi > lo) {
        let t = (v - lo) / (hi - lo); if (better === 'low') t = 1 - t;
        style = `background: rgba(var(--heat), ${(0.06 + t * 0.32).toFixed(2)})`;
        if (t === 1) cls += ' best';
      }
      const s = key === 'tours' ? (o.entHtml ? `<span class="s">${o.entHtml}</span>` : '')   // 기권·불참: 항목마다 말풍선(어느 대회인지)
        : sub && o.games && (mode !== 'league' || NO_LEAGUE.has(key)) && sub(o) ? `<span class="s">${key === 'dominance' ? esc(sub(o)).replace(/ · /g, '<br>') : esc(sub(o))}</span>` : '';   // 지배력 구성은 항목마다 한 줄 (한 줄로 쓰면 모든 열이 넓어진다)
      const tip = rk ? (key !== 'tours' && txt ? summaryTip(rk, cols[i], i, key, v, better, fmt, isRate && !NO_LEAGUE.has(key)) : '')
        : sub && o.games && key !== 'tours' ? ` title="${esc(sub(o))}"` : '';
      // 베스트·워스트 에버 칸: 누르면 그 경기 팝업 (pane 클릭 처리에서 data-gpst 로 찾음)
      const pg = key === 'bestAvg' ? o.bestG : key === 'worstAvg' ? o.worstG : null;
      const gp = pg ? ` data-gpst="${pg.pst}" data-gkind="${key === 'bestAvg' ? 'best' : 'worst'}" data-glabel="${esc(cols[i].label)}"` : '';
      h += `<td class="${cls}${pg ? ' gpop' : ''}" style="${style}"${tip}${gp}>${txt}${txt ? s + diff : ''}</td>`;
    });
    if (lg) h += `<td class="lg">${isRate && !NO_LEAGUE.has(key) ? lg50(fmt(lg[key])) : ''}</td>`;
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}

const panes = {}; window.indivPanes = panes;   // 기록지 별도 창에서 단식 세트 선수를 이 창 개인투어에 띄울 때 쓴다
class Pane {
  constructor(el, key) {
    this.el = el; this.key = key; this.data = null;
    el.innerHTML = `<div class="search"><input placeholder="선수 이름 검색 (예: 강동궁)" autocomplete="off"><div class="suggest" hidden></div></div><div class="content"><div class="empty">선수를 검색하세요.<br><small>경기 목록에서 상대 이름을 누르면 반대쪽 화면에 열립니다.</small></div></div>`;
    this.input = $('input', el); this.sug = $('.suggest', el); this.content = $('.content', el);
    let timer, items = [], on = -1, seq = 0, pendingEnter = false;
    const show = () => { this.sug.hidden = !items.length; this.sug.innerHTML = items.map((p, i) => `<div data-i="${i}" class="${i === on ? 'on' : ''}"><b>${esc(p.name)}</b><small>${esc(p.type)} · ${esc(p.birth || '')} · ${p.n}경기${p.last ? ' · 최근 ' + seasonLabel(p.last) : ''}</small></div>`).join(''); };
    // 늦게 도착한 옛 검색 결과가 새 결과를 덮어쓰지 않도록 순번을 확인한다
    const search = async () => {
      const my = ++seq, q = this.input.value.trim();
      const r = q ? await api('/api/search?q=' + encodeURIComponent(q)) : [];
      if (my !== seq) return;
      items = r; on = items.length ? 0 : -1; show();
      if (pendingEnter) { pendingEnter = false; if (items[0]) pick(0); }
    };
    const pick = i => { const id = items[i].id; items = []; show(); this.input.blur(); this.load(id); };
    this.input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 100); });
    this.input.addEventListener('focus', () => this.input.select());
    this.input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { on = Math.min(on + 1, items.length - 1); show(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { on = Math.max(on - 1, 0); show(); e.preventDefault(); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        // 한글 조합 중이거나 검색 결과가 아직 없으면, 결과가 오는 대로 첫 선수를 연다
        if (e.isComposing || e.keyCode === 229 || !items[on]) { pendingEnter = true; clearTimeout(timer); setTimeout(search, 30); }
        else pick(on);
      }
      else if (e.key === 'Escape') { items = []; show(); }
    });
    this.sug.addEventListener('mousedown', e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); pick(+d.dataset.i); } });
    this.input.addEventListener('blur', () => setTimeout(() => { items = []; show(); }, 150));
    el.addEventListener('click', e => {
      if (e.target.closest('[data-qa]')) { this.setQa(!this.qaOpen); return; }

  tourGrid(seasons, tours, res) {
    const avgByTour = {};

    const seqs = [...new Set(tours.map(t => t.seq))].sort((a, b) => (a === 'F' ? 99 : +a) - (b === 'F' ? 99 : +b));

      h += `<tr><th class="lab">${tourShort(q)}</th>`;
      colS.forEach(s => {
        const t = tours.find(x => x.season === s && x.seq === q);

      });
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    // 시즌별 최고 대회 에버리지 (리그 전체 선수 중) + 이 선수의 시즌 최고 대회 에버
    const L = this.league;

    const mine = s => Object.values(this.data.games.filter(g => g.season === s).reduce((m, g) => { const o = m[g.tour] || (m[g.tour] = { tour: g.tour, seq: g.seq, season: s, p: 0, i: 0, n: 0 }); o.p += g.pts; o.i += g.inn; o.n++; return m; }, {}))
      .filter(o => o.n >= 3 && o.i).map(o => ({ ...o, avg: o.p / o.i })).sort((a, b) => b.avg - a.avg)[0];
    const who = o => `<span class="opp" data-opp="${esc(o.player)}">${esc(o.name)}</span>`;
    h += `<div class="subhead">시즌별 최고 대회 에버리지 <small>(한 선수가 한 대회에서 기록한 에버리지 · 3경기 이상)</small></div>
      <table class="games tbest"><thead><tr><th>시즌</th><th>최고 기록 선수</th><th>대회</th><th>대회 에버</th><th>${esc(this.data.player.name)} 최고</th></tr></thead><tbody>`;
    ordS(seasons).forEach(s => {
      const b = (L.tourBest[s] || [])[0], m = mine(s);

        <td>${b ? `<b>${f3(b.avg)}</b><span class="s">${b.n}경기</span>` : ''}</td>
        <td>${m ? `${f3(m.avg)}<span class="s">${esc(tourShort(m.seq))} · ${m.n}경기</span>` : ''}</td></tr>`;

    L.tourBestAll.forEach((o, i) => {

  // 세트 번호별 평균 득점·이닝·실점·득실비 (이번 시즌 · 통산)
  setNoScore(cols) {

    return h + '</tbody></table></div><div class="note">득실비 = 득점 ÷ 실점. 1보다 크면 그 세트에서 넣은 점수가 더 많음.</div>';

  // 세트별 기록 칩 표 (세트 번호별 · 스코어 상황별 공통): 줄 = 세트 묶음, 열 = 시즌 + 통산
  //  칸 안 3줄 = 에버 · 세트 승률(승-패) · 초구 성공률(성공/시도). 위 버튼으로 줄을 넣고 빼도 칸 크기는 그대로 (라운드별 칩처럼)
  //  색: 내 시즌 = 시즌끼리 에버, 리그 평균 = 그 시즌 리그의 같은 묶음 에버와 비교 (작은 글씨 차이)
  //  rows = [['__grp', 이름] | [이름, x => 이 줄에 넣을 세트인가, { noWin, tip }]]  (x = setsWithScore 한 칸)
  setRowsGrid(cols, mode, rows, note) {
    const L = this.league, lgOn = mode === 'league' && L, show = this.setShow;
    const W = cols.map(c => setsWithScore(c.games));
    const lgW = c => { const C = L._sw || (L._sw = {}); if (!C[c.label]) { const s = Object.keys(L.season).find(x => seasonLabel(+x) === c.label); C[c.label] = setsWithScore(c.label === '통산' ? L.games : s ? L.season[s]._g : []); } return C[c.label]; };
    const avgOf = o => o && o.i ? o.p / o.i : null;
    const labels = [['avg', '에버'], ['win', '세트 승률'], ['fb', '초구 성공률']];
    const btns = `<div class="bclegend rshow"><span class="bcpers">${labels.map(([k, l]) => `<button data-ss="${k}" class="${show[k] ? 'on' : ''}" aria-pressed="${!!show[k]}">${l}</button>`).join('')}</span></div>`;
    const line = (on, v, sub) => `<span class="sv"${on ? '' : ' style="visibility:hidden"'}>${v ? `<b>${v}</b>${sub ? `<small>${sub}</small>` : ''}` : '&nbsp;'}</span>`;
    let h = btns + `<div class="tw"><table class="grid stab"><thead><tr><th class="lab"></th>${cols.map((c, i) => `<th class="${i === cols.length - 1 ? 'tot' : ''}">${esc(c.label)}</th>`).join('')}</tr></thead><tbody>`;
    rows.forEach(([lab, f, opt = {}]) => {
      if (lab === '__grp') { h += `<tr class="grp"><th colspan="${cols.length + 1}">${f}</th></tr>`; return; }
      const A = W.map(ws => setAgg(ws.filter(f).map(x => x.s))), vs = A.map(avgOf);
      if (!A.some(o => o.n)) return;
      const sv = vs.slice(0, -1).filter(v => v != null), lo = Math.min(...sv), hi = Math.max(...sv);
      h += `<tr><th class="lab"${opt.tip ? ` title="${esc(opt.tip)}"` : ''}>${lab}</th>` + cols.map((c, i) => {
        const o = A[i], v = vs[i], last = i === cols.length - 1; let cls = last ? 'tot' : '', style = '', diff = '';
        if (!o.n) return `<td class="${cls}"></td>`;
        if (lgOn && show.avg) { const x = vsLeague(v, avgOf(setAgg(lgW(c).filter(f).map(y => y.s))), f3); if (x) { cls += ' ' + x.cls; style = x.style; diff = `<em class="dd">${x.txt}</em>`; } }
        else if (!lgOn && show.avg && !last && sv.length > 1 && hi > lo && v != null) { const t = (v - lo) / (hi - lo); style = `background: rgba(var(--heat), ${(0.06 + t * 0.32).toFixed(2)})`; if (t === 1) cls += ' best'; }
        return `<td class="${cls}" style="${style}">${line(show.avg, v != null ? f3(v) : '', diff)}${line(show.win && !opt.noWin, pct(o.w / o.n), `${o.w}-${o.n - o.w}`)}${line(show.fb, o.fbN ? pct(o.fbH / o.fbN) : '', o.fbN ? `${o.fbH}/${o.fbN}` : '')}</td>`;
      }).join('') + '</tr>';
    });
    return h + `</tbody></table></div><div class="note">칸 안 순서: 에버 · 세트 승률(승-패) · 초구 성공률(성공/선공 세트). ${note || ''} 25점 단판 경기는 뺍니다.</div>`;
  }
  setNoGrid(cols, mode) {
    const nos = [...new Set(setsWithScore(cols[cols.length - 1].games).map(x => x.s.no))].filter(n => n <= 7).sort((a, b) => a - b);
    if (!nos.length) return '<div class="note">세트제 경기가 없습니다.</div>';

    const rRows = Object.keys(rc).sort((a, b) => (ORDER.indexOf(a) + 99) % 99 - (ORDER.indexOf(b) + 99) % 99);
    const rmax = Math.max(...Object.values(rc));
    box.innerHTML = `<div class="subhead" style="padding:14px 0 4px;font-weight:700;color:var(--ink)">${esc(type)} 역대 웰컴톱랭킹 <small style="font-weight:400;color:var(--sub)">(총 ${n}회 · 대회마다 한 명)</small></div>
      <div class="awgrid"><div><div class="subhead" style="padding:4px 0">최다 수상 TOP 5</div>
      ${tblR(['순위', '선수', '수상', '최고 에버'], topCnt.map((x, i) => [`${cr[i]}`, who(x.a), `<b>${x.n}회</b>`, f3(x.best)]))}
      ${myCnt >= 0 && cr[myCnt] > 5 ? `<div class="note">${esc(this.data.player.name)}: ${cr[myCnt]}위 (${cnt[myCnt].n}회)</div>` : ''}</div>
      <div><div class="subhead" style="padding:4px 0">최고 톱랭킹 에버 TOP 5</div>
      ${tblR(['#', '선수', '에버', '대회·라운드'], topAvg.map((a, i) => [`${i + 1}`, who(a), `<b>${f3(a.avg)}</b>`, `<span title="${esc(a.tour_name || '')}">${esc(seasonLabel(a.season))} ${esc(tourShort(a.seq))} ${esc(tourSpName(a.tour_name))}</span> ${esc(rn(a))}<span class="s">vs ${esc(a.opp_name || '')} ${a.sw != null ? `${a.sw}:${a.sl}` : ''}</span>`]))}</div></div>
      <div class="awgrid"><div><div class="subhead" style="padding:8px 0 4px">에버 구간별 수상 비율</div>
      ${tblR(['구간', '수상', '비율', ''], binRows.map(lo => [`${lo.toFixed(1)} ~ ${(lo + 0.5).toFixed(1)}`, `${bins[lo]}회`, `<b>${pct(bins[lo] / n)}</b>`, bar(bins[lo], bmax)]))}</div>
      <div><div class="subhead" style="padding:8px 0 4px">달성 라운드 비율</div>
      <table class="games awround"><thead><tr><th>라운드</th><th>수상</th><th>비율</th><th></th></tr></thead><tbody>${rRows.map(r => {
        // 줄을 누르면 그 라운드에서 받은 수상 기록 (에버 높은 순): 선수 · 에버 · 시즌 · 대회 · 상대
        const won = list.filter(a => (rn(a) || '기록 없음') === r).sort((x, y) => y.avg - x.avg);
        return `<tr class="row"><td>${esc(r)} <span class="s" style="display:inline">▾</span></td><td>${rc[r]}회</td><td><b>${pct(rc[r] / n)}</b></td><td>${bar(rc[r], rmax)}</td></tr>
          <tr class="det" hidden><td colspan="4" style="padding:0"><table class="games awlist"><thead><tr><th>선수</th><th>에버</th><th>시즌</th><th>대회</th><th>상대 · 스코어</th></tr></thead><tbody>${won.map(a => `<tr${a.player === me ? ' class="me"' : ''}>
            <td>${who(a)}</td><td><b>${f3(a.avg)}</b></td><td>${esc(seasonLabel(a.season))}</td><td>${esc(tourShort(a.seq))} <span class="s" style="display:inline" title="${esc(a.tour_name || '')}">${esc(tourSpName(a.tour_name))}</span></td>
            <td>${a.opp_name ? `vs ${esc(a.opp_name)}` : ''}${a.sw != null ? ` ${a.win ? '승' : '패'} ${a.sw}:${a.sl}` : ''}</td></tr>`).join('')}</tbody></table></td></tr>`;
      }).join('')}</tbody></table></div></div>
      <div class="note">구간은 0.5 단위 (예: 2.5 ~ 3.0 = 2.500 이상 3.000 미만). pbatour.org 공식 수상 기록 기준.</div>`;
  }
  // 기본정보 칸을 눌렀을 때 나오는 히스토리
  kpiDetail(key) {
    const { games, results, awards, tours, player: p } = this.data;
    const tourBy = Object.fromEntries(tours.map(t => [t.code, t]));
    const tl = t => t ? `${seasonLabel(t.season)} ${tourShort(t.seq)}` : '';
    const vs = g => g ? `<span class="opp" data-opp="${esc(g.opp)}">${esc(g.opp_name)}</span>` : '';
    const sc = g => g ? (g.single ? `${g.sets[0] ? g.sets[0].pts : ''}점` : `${g.sw}:${g.sl}`) : '';
    const where = g => `${esc(g.date || '')} · ${esc(seasonLabel(g.season))} ${esc(tourShort(g.seq))} ${esc(roundName(g))}`;
    // 세트 흐름: 승승패패패 (승부치기는 괄호)
    const setFlow = g => g && !g.single && g.sets ? `<span class="setflow">${g.sets.map(x => `<i class="${x.win ? 'w' : 'l'}">${x.win ? '승' : '패'}</i>`).join('')}${g.tiebreak ? `<i class="${g.tiebreak.win ? 'w' : 'l'}">(${g.tiebreak.win ? '승' : '패'})</i>` : ''}</span>` : '';
    const tbl = (head, rows) => rows.length
      ? `<table class="games"><thead><tr>${head.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`
      : '<div class="note">기록이 없습니다.</div>';
    const bySeason = (f, fmt, sub) => {
      const ss = [...new Set(games.map(g => g.season))].sort();
      return tbl(['시즌', '값', '기록'], ss.map(s => { const o = calc(games.filter(g => g.season === s)); return [seasonLabel(s), `<b>${fmt(f(o))}</b>`, sub(o)]; }));
    };
    // 입상 기록: 월드챔피언십 우승 → 우승 → 준우승 → 3위(4강). 대회마다 마지막 경기 한 줄, 누르면 그 대회 전체 경기(라운드·상대·스코어·세트 점수·에버·HR)
    if (key === 'medal') {
      const MED = [['1', '🥇 우승'], ['2', '🥈 준우승'], ['3', '🥉 3위']], MEDN = Object.fromEntries(MED);
      const isWC = r => (tourBy[r.tour] || {}).seq === 'F';
      const GROUPS = [['wc', '🌏 월드챔피언십', r => isWC(r) && r.result === '1'], ...MED.map(([w, n]) => [w, n, r => r.result === w && !(w === '1' && isWC(r))])];   // 월챔 항목은 우승만, 월챔 준우승 · 3위는 해당 묶음으로
      const resOf = t => (results.find(r => r.tour === t.code) || {}).result;
      const all = this.data.allGames;
      const sum3 = GROUPS.map(([, n, f]) => `${n} <b>${results.filter(f).length}</b>`).join(' · ');
      return `<div class="note" style="margin-top:0">${sum3} · 줄을 누르면 그 대회 경기 전체가 펼쳐집니다${results.some(r => isWC(r) && r.result !== '1' && MEDN[r.result]) ? ' · <span class="wcmedkey">배경색 줄</span> = 월드챔피언십 입상' : ''}</div>` + GROUPS.map(([want, name, f]) => {
        const list = results.filter(f).map(r => tourBy[r.tour]).filter(Boolean).sort((a, b) => (want === 'wc' ? resOf(a).localeCompare(resOf(b)) : 0) || (b.end_date || '').localeCompare(a.end_date || ''));
        if (!list.length) return '';
        return `<div class="subhead">${name} ${list.length}회</div><table class="games medal"><thead><tr><th>시즌·투어</th><th>${want === 'wc' ? '마지막 상대' : want === '3' ? '4강 상대' : '결승 상대'}</th><th>결과</th><th>대회 에버</th><th>경기</th></tr></thead><tbody>${list.map(t => {
          const tg = all.filter(g => g.tour === t.code), last = tg[tg.length - 1], o = calc(tg.filter(g => !isForfeit(g)));
          const rows = tg.map(g => isForfeit(g) ? `<tr class="ff"><td>${esc(roundName(g))}</td><td>${vs(g)}</td><td colspan="4"><span class="${g.win ? 'w' : 'l'}">${g.win ? '기권승' : '기권패'}</span></td></tr>`
            : `<tr><td>${esc(roundName(g))}</td><td>${vs(g)}</td><td><span class="${g.win ? 'w' : 'l'}">${g.win ? '승' : '패'} ${sc(g)}</span>${setFlow(g)}${g.tiebreak ? '<span class="tag">승부치기</span>' : ''}</td>
              <td class="ss">${g.single ? '' : (g.sets || []).map(x => `<span class="${x.win ? 'w' : 'l'}">${x.pts}${x.opp_pts != null ? ':' + x.opp_pts : ''}</span>`).join(' ')}</td><td>에버 <b>${f3(g.avg)}</b></td><td>HR ${g.hr ?? '–'}</td></tr>`).join('');
          return `<tr class="row${want !== 'wc' && t.seq === 'F' ? ' wcmed' : ''}"><td>${want === 'wc' ? `<b>${MEDN[resOf(t)]}</b> ` : ''}<b>${esc(tl(t))}</b><span class="s" title="${esc(t.name)}">${esc(tourAbbr(t.name))} · ${esc(t.end_date || '')}</span></td><td>${last ? vs(last) : ''}</td>
            <td>${last ? `<span class="${last.win ? 'w' : 'l'}">${sc(last)}</span>${setFlow(last)}` : '<span class="s">기록 없음</span>'}</td><td><b>${f3(o.avg)}</b><span class="s">HR ${o.hr ?? '–'}</span></td><td>${o.win}승 ${o.lose}패 ▾</td></tr>
            <tr class="det" hidden><td colspan="5" style="padding:0"><table class="games tpath"><tbody>${rows}</tbody></table></td></tr>`;
        }).join('')}</tbody></table>`;
      }).join('');
    }
    // 그랜드 에버 = 총득점 ÷ 총이닝 (1:1 경기 전체, 25점 단판 포함·기권 제외), 시즌별 + 통산
    if (key === 'grand') {
      const ss = ordS([...new Set(games.map(g => g.season))]);
      const row = (lab, gs, strong) => { const pt = sum(gs, g => g.pts), inn = sum(gs, g => g.inn); return [strong ? `<b>${lab}</b>` : lab, `${pt.toLocaleString()}점`, `${inn.toLocaleString()}이닝`, `<b>${f3(inn ? pt / inn : null)}</b>`, `${gs.length}경기`]; };
      return tbl(['시즌', '총득점', '총이닝', '에버', ''], [row('통산', games, true), ...ss.map(s2 => row(seasonLabel(s2), games.filter(g => g.season === s2)))]) +
        `<div class="note">1:1 경기 기록 기준. 홈피 통산 그랜드 에버 ${f3(p.stats && p.stats.avg)}${p.stats && p.stats.innings ? ` (${(p.stats.p1 + 2 * p.stats.p2).toLocaleString()}점 / ${p.stats.innings.toLocaleString()}이닝)` : ''} — 홈피 값에는 서바이벌 경기도 들어가 조금 다를 수 있음.</div>`;
    }
    if (key === 'hrtop') {
      const top = games.filter(g => g.hr).sort((a, b) => b.hr - a.hr || b.avg - a.avg).slice(0, 5);
      return tbl(['#', '하이런', '대회', '상대', '결과'], top.map((g, i) => {
        const s2 = g.sets.find(x => x.set_hr === g.hr);
        return [`${i + 1}`, `<b>${g.hr}점</b>${s2 ? `<span class="s">${s2.no}세트</span>` : ''}`, `${esc(seasonLabel(g.season))} ${esc(tourShort(g.seq))} ${esc(roundName(g))}<span class="s">${esc(g.date || '')}</span>`, vs(g),
          `<span class="${g.win ? 'w' : 'l'}">${g.win ? '승' : '패'} ${sc(g)}</span><span class="s">에버 ${f3(g.avg)}</span>`];
      })) + `<div class="note">홈피 통산 하이런 ${p.stats && p.stats.hr != null ? p.stats.hr + '점' : '–'} (서바이벌·팀리그 포함이라 위 1위보다 높을 수 있음).</div>`;
    }
    // 에버 2.0+ / 1.0- : 시즌별 횟수·비율 + 해당 경기 (최근 순)
    if (key === 'avg20' || key === 'avg10') {
      const k = key === 'avg20' ? 'hi' : 'lo', ss = ordS([...new Set(games.map(g => g.season))]);
      const L = this.league, pid = this.data.player.id;
      const lgc = (scope, s2) => { if (!L) return ['', '']; const x = avgShareRank(L, k, scope, s2, pid); return [x.avg != null ? pct(x.avg) : '–', x.rank ? `<b>${x.rank}위</b><span class="s">${x.of}명 중</span>` : `<span class="s">${RANK_MIN[scope]}경기 미만</span>`]; };
      const line = (lab, gs, scope, s2) => { const n = gs.filter(isPlayed).length, c = avgPick(gs, k).length; return [lab, `<b>${pct(n ? c / n : null)}</b>`, `${c}회 / ${n}경기`, ...lgc(scope, s2)]; };
      const pick = avgPick(games, k).slice().reverse().slice(0, 15);
      return tbl(['시즌', '비율', '횟수', '전 선수 평균', `순위${k === 'lo' ? ' <small>(적을수록 위)</small>' : ''}`], [line('<b>통산</b>', games, 'all'), ...ss.map(s2 => line(seasonLabel(s2), games.filter(g => g.season === s2), 'season', s2))]) +
        (L ? '' : '<div class="note">리그 평균 계산 중… (잠시 뒤 다시 열면 보입니다)</div>') +
        `<div class="subhead">해당 경기 (최근 ${pick.length}경기)</div>` + tbl(['에버', '대회', '상대', '결과'], pick.map(g => [`<b>${f3(g.avg)}</b>`, `${esc(seasonLabel(g.season))} ${esc(tourShort(g.seq))} ${esc(roundName(g))}<span class="s">${esc(g.date || '')}</span>`, vs(g), `<span class="${g.win ? 'w' : 'l'}">${g.win ? '승' : '패'} ${sc(g)}</span>`])) +
        `<div class="note">${k === 'hi' ? '한 경기 에버리지 2.000 이상' : '한 경기 에버리지 1.000 미만'}인 경기 비율 (1:1 경기 기록, 기권 경기 제외). 전 선수 평균 = 같은 종목 모든 경기를 합친 비율, 순위 = 통산 ${RANK_MIN.all}경기 · 시즌 ${RANK_MIN.season}경기 이상 선수 중 (같으면 같은 순위).</div>`;
    }
    // 묶은 칸 팝업: 시즌(최근 → 과거) 줄마다 두 항목을 나란히, 맨 위 통산
    if (key === 'winset' || key === 'bankfb') {
      const ss = ordS([...new Set(games.map(g => g.season))]);
      const cols = key === 'winset'
        ? [['세트제 경기 승률', o => o.winRate, o => `${o.win}승 ${o.lose}패`], ...(games.some(g => g.single) ? [['25점 단판 승률', o => ratio(o.singleW, o.single), o => `${o.singleW}승 ${o.single - o.singleW}패`]] : []), ['세트 승률', o => o.setRate, o => `${o.setW}-${o.setL}`]]
        : [['뱅킹 승률', o => o.bankWinRate, o => `${o.bankWin}승 ${o.bankLose}패`], ['초구 성공률', o => o.fbSuccess, o => `${o.fbN}회 · 초에 ${f3(o.fbAvg)}`]];
      const row = (lab, gs) => { const o = calc(gs); return [lab, ...cols.map(([, v, sub]) => `<b>${pct(v(o))}</b><span class="s">${sub(o)}</span>`)]; };
      return tbl(['시즌', ...cols.map(c => c[0])], [row('<b>통산</b>', games), ...ss.map(s2 => row(seasonLabel(s2), games.filter(g => g.season === s2)))]);
    }
    if (key === 'bank') return bySeason(o => o.bankWinRate, pct, o => `${o.bankWin}-${o.bankLose}`);
    if (key === 'worst') {
      const low = games.filter(isPlayed).sort((a, b) => a.avg - b.avg).slice(0, 5);
      return tbl(['#', '에버', '대회', '상대', '결과', ''], low.map((g, i) => [`${i + 1}`, `<b>${f3(g.avg)}</b>`, `${esc(seasonLabel(g.season))} ${esc(tourShort(g.seq))} ${esc(roundName(g))}<span class="s">${esc(g.date || '')}</span>`, vs(g),
        `<span class="${g.win ? 'w' : 'l'}">${g.win ? '승' : '패'} ${sc(g)}</span>`, `HR ${g.hr ?? ''}`])) + '<div class="note">1:1 경기 기록 하위 5경기 (기권 경기 제외).</div>';
    }
    if (key === 'title' || key === 'final') {
      const want = key === 'title' ? '1' : '2';
      const list = results.filter(r => r.result === want).map(r => tourBy[r.tour]).filter(Boolean).sort((a, b) => (b.end_date || '').localeCompare(a.end_date || ''));
      return tbl(['시즌·투어', '결승 상대', '세트', '에버'], list.map(t => {
        const fin = games.filter(g => g.tour === t.code && (g.round_raw === '결승' || g.round_code === 2)).pop();
        return [`<b>${esc(tl(t))}</b><span class="s" title="${esc(t.name)}">${esc(tourAbbr(t.name))}</span>`, fin ? vs(fin) : '<span class="s">기록 없음</span>',
          fin ? `<span class="${fin.win ? 'w' : 'l'}">${sc(fin)}</span> ${setFlow(fin)}${fin.tiebreak ? '<span class="tag">승부치기</span>' : ''}` : '', fin ? f3(fin.avg) : ''];
      }));
    }
    if (key === 'award') {
      const list = awards.slice().sort((a, b) => sDir(a.season, b.season) || sDir(a.tour, b.tour));
      return tbl(['시즌·투어', '에버', '경기'], list.map(a => {
        const g = games.find(x => x.pst === a.pst);
        const tn = (tourBy[a.tour] || {}).name || a.name;   // 대회명은 스폰서 3자까지 (22-23 8차 크라운), 전체 이름은 말풍선
        return [`<b title="${esc(tn)}">${esc(tl(tourBy[a.tour]))} ${esc(tourSpName(tn))}</b>`,`<b>${f3(a.avg)}</b>`, g ? `${esc(roundName(g))} vs ${vs(g)} <span class="${g.win ? 'w' : 'l'}">${g.win ? '승' : '패'} ${sc(g)}</span> · ${esc(g.date)}` : `${esc(a.round_desc === '준결승' ? '4강' : a.round_desc || '')} <span class="s" style="display:inline">(경기 기록 없음)</span>`];
      })) + '<div class="note">pbatour.org 공식 수상 기록 (대회마다 한 명, 동률이면 세컨드 에버로 결정).</div><div class="awleague"><div class="note">리그 전체 웰컴톱랭킹 기록을 불러오는 중…</div></div>';
    }
    if (key === 'win') return bySeason(o => o.winRate, pct, o => `${o.win}승 ${o.lose}패`);
    if (key === 'set') return bySeason(o => o.setRate, pct, o => `${o.setW}-${o.setL}`);
    if (key === 'fb') return bySeason(o => o.fbSuccess, pct, o => `${o.fbN}회·초에 ${f3(o.fbAvg)}`);
    if (key === 'hr' || key === 'best') {
      const top = games.filter(g => key === 'hr' ? g.hr : g.avg).slice()
        .sort((a, b) => key === 'hr' ? b.hr - a.hr || b.avg - a.avg : b.avg - a.avg).slice(0, key === 'best' ? 5 : 15);
      const rows = top.map((g, i) => {
        const s = key === 'hr' ? g.sets.find(x => x.set_hr === g.hr) : null;
        return [`${i + 1}`, `<b>${key === 'hr' ? g.hr + '점' : f3(g.avg)}</b>`, `${esc(seasonLabel(g.season))} ${esc(tourShort(g.seq))} ${esc(roundName(g))}<span class="s">${esc(g.date || '')}</span>`, vs(g),
          `<span class="${g.win ? 'w' : 'l'}">${g.win ? '승' : '패'} ${sc(g)}</span>${s ? `<span class="tag">${s.no}세트</span>` : ''}`, key === 'hr' ? `에버 ${f3(g.avg)}` : `HR ${g.hr ?? ''}`];
      });
      const siteV = key === 'hr' ? (p.stats && p.stats.hr) : (p.stats && p.stats.best_avg);
      return tbl(['#', key === 'hr' ? '하이런' : '에버', '대회', '상대', '결과', ''], rows) +

  // 라운드별 탈락 횟수: 대회마다 마지막 경기를 진 라운드. 아래 작은 글씨 = 그 라운드 에버, 그 기간 대회 중 비율. 마지막 줄은 우승
  roundTable(cols, mode) {
    const ORDER = ['PPQ', 'PQ', 'Q', '128강', '64강', '조별리그', '32강', '16강', '8강', '4강', '결승'];
    // 대회별 결과: { tour: '128강' | ... | '우승' }  (아직 이기고 올라가 있는 진행 중 대회는 뺌)

    };

  }

(() => {

// 방송 요약 PDF 만들기 · 공유: 맥 앱이면 네이티브(createPDF → 다운로드 폴더, 공유는 공유 메뉴), 아니면 브라우저 인쇄(PDF 저장) · 공유 시트
//  pdfmode: 요약만 남기고 스크롤 상자를 풀어 페이지 전체가 한 문서가 되게 한다
//  kind: 'text' = 요약 글자로 공유, 'share' = PDF로 공유, 'pdf' = PDF 파일 저장
function exportSummary(kind, title) {
  if (kind === 'text') {
    const box = document.querySelector('body.tbcmode') ? $('#tbc') : $('#bc');
    const text = `${title}\n\n` + box.innerText.replace(/^.*(공유|PDF로 만들기|비교 화면|새 창으로|창 닫기).*$/gm, '').replace(/\n{3,}/g, '\n\n').trim();
    let acked = false; window.pbaPdfAck = () => { acked = true; };
    const fb = () => { if (navigator.share) { navigator.share({ title, text }).catch(() => {}); return; } (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => alert('요약을 복사했습니다. 붙여 넣어 공유하세요.'), () => alert('공유하지 못했습니다.')); };
    try { webkit.messageHandlers.pba.postMessage('sharetext:' + text); } catch (e) { fb(); return; }
    setTimeout(() => { if (!acked) fb(); }, 1500);
    return;
  }
  const name = `${title} ${new Date().toISOString().slice(0, 10)}`.replace(/[\/\\:*?"<>|]/g, ' ').trim();
  document.body.classList.add('pdfmode');
  let acked = false;
  const end = () => document.body.classList.remove('pdfmode');
  window.pbaPdfAck = () => { acked = true; };
  window.pbaPdfDone = r => { end(); if (r === null) alert('PDF를 만들지 못했습니다.'); };
  const fallback = () => {
    end();
    if (kind === 'share' && navigator.share) { navigator.share({ title: name, url: location.href }).catch(() => {}); return; }
    if (window.webkit && window.webkit.messageHandlers) { alert('PDF · 공유 버튼은 앱을 새로 만든 뒤에 작동합니다. 앱을 껐다가 다시 켜 주세요.'); return; }
    document.body.classList.add('pdfmode'); setTimeout(() => { window.print(); end(); }, 50);
  };
  try { webkit.messageHandlers.pba.postMessage(`${kind}:${name}`); } catch (e) { fallback(); return; }
  setTimeout(() => { if (!acked) fallback(); }, 1500);   // 예전 앱은 응답이 없다
}

// 방송요약 수치 칸 순위 말풍선: 커서를 올리면 그 칸 오른쪽에 (맨 위 그 선수 순위 → TOP20), 벗어나면 사라짐
let bcL = null, bcSeason = null, bcRkFor = null;
const BC_FMT = {};
function bcRankBubble(key, scope, me, meName, name, low, games) {
  const L = bcL; if (!L) return '';
  const isSet = key.startsWith('set:'), isSt = key.startsWith('st:'), fmt = isSet ? f3 : isSt ? pct : BC_FMT[key] || f3;
  const lg = scope === 'all' ? L.all : L.season[bcSeason], all = rankTable(L, scope, bcSeason, 'set');
  // 값: 계산 기록(o) · 게임 지배력 · 세트별 에버(10세트 이상) · 세트 스코어별 최종 승률(5번 이상) — 선수마다 한 번만 계산해 둔다
  const val = x => {
    const c = x._v || (x._v = {}); if (key in c) return c[key];
    let v;
    if (key === 'dominance') v = dominanceOf(x.o, lg);
    else if (isSet) { const b = (x._bs || (x._bs = bySetNo(x.gs)))[+key.slice(4)]; v = b && b.n >= 10 && b.i ? b.p / b.i : null; }
    else if (isSt) { const [, T, ...sk] = key.split(':'); const ss = x._ss || (x._ss = {}); const m = ss[T] || (ss[T] = stateStats(x.gs.filter(g => (g.target || Math.max(g.sw, g.sl)) === +T))); const o = m[sk.join(':')]; v = o && o.n >= 5 ? o.w / o.n : null; }
    else v = x.o[key];
    return (c[key] = v);
  };
  const ok = v => v != null && !isNaN(v) && isFinite(v);
  const list = all.filter(x => ok(val(x))).sort((a, b) => low ? val(a) - val(b) : val(b) - val(a));
  if (!list.length) return '';
  const i = list.findIndex(x => x.id === me);
  const row = (x, j, cls = '') => `<tr class="${cls}${x.id === me ? ' mine' : ''}"><td>${j + 1}</td><td>${esc(x.name)}</td><td>${fmt(val(x))}</td></tr>`;
  const need = isSet ? ' · 그 세트 10번 이상' : isSt ? ' · 그 스코어 5번 이상' : '';
  const top = i >= 0 ? row(list[i], i, 'me') : `<tr class="me"><td colspan="3">${esc(meName)} · 순위 기준 미달</td></tr>`;
  const gl = games ? `<div class="rgames">${games.split('\n').map(esc).join('<br>')}</div>` : '';
  return `<div class="rkh0">${scope === 'all' ? '통산' : `${seasonLabel(bcSeason)} 시즌`} ${esc(name)} <small>${RANK_MIN[scope]}경기 이상${need} ${list.length}명</small></div>${gl}<div class="cols"><div><table>${top}${list.slice(0, 10).map((x, j) => row(x, j)).join('')}</table></div></div>`;
}

    <tr><th class="pt">이번 대회<small>${esc(tl(da))}</small></th><th class="ps">이번 시즌</th><th class="pa">통산</th><th></th><th class="pa">통산</th><th class="ps">이번 시즌</th><th class="pt">이번 대회<small>${esc(tl(db))}</small></th></tr></thead><tbody>`
    + sec('경기 전')
    + row1('상대 전적', hA.length ? `${hA.filter(g => g.win).length}승 ${hA.filter(g => !g.win).length}패` : '첫 맞대결', hB.length ? `${hB.filter(g => g.win).length}승 ${hB.filter(g => !g.win).length}패` : '첫 맞대결')
    + row('승-패', wl(A), wl(B))
    + row('에버리지', tri(A, 'avg', f3), tri(B, 'avg', f3))
    + row('하이런', tri(A, 'hr', int), tri(B, 'hr', int))
    + row('뱅킹 승률', tri(A, 'bankWinRate'), tri(B, 'bankWinRate'))
    + row1('상대전 뱅킹 승률', bankH(hA), bankH(hB))
    + row('흰공(ㅎ) 경기 승률', tri(A, 'whRate'), tri(B, 'whRate'))
    + row('노란공(ㄴ) 경기 승률', tri(A, 'yeRate'), tri(B, 'yeRate'))
    + row('초구 성공률<span class="s">지금 경기 포함</span>', triFb(A, RA, 'fbSuccess'), triFb(B, RB, 'fbSuccess'))
    + row('초구 에버<span class="s">지금 경기 포함</span>', triFb(A, RA, 'fbAvg', f3), triFb(B, RB, 'fbAvg', f3))
    + row('초구 다득점(2점+)<span class="s">지금 경기 포함</span>', triFb(A, RA, 'fbMulti'), triFb(B, RB, 'fbMulti'))
    + row('초구 성공 시 세트 승률<span class="s">지금 경기 끝난 세트 포함</span>', triFb(A, RA, 'fbHitWin'), triFb(B, RB, 'fbHitWin'))
    + sec(`${setNo}세트 시작 전 (${setNo}세트 에버 · 승률)`)
    + row(`${setNo}세트 기록`, setRec(A), setRec(B))
    + '</tbody></table>';
  const liveTbl = `<table class="grid ltab lnow"><thead><tr><th class="nm">${esc(pa.name)}</th><th></th><th class="nm">${esc(pb.name)}</th></tr></thead><tbody>${nowRows}`
    + (pa.sets + pb.sets > 0 ? (() => { const fa = flow(A, pa.sets, pb.sets, true) || {}, fb = flow(B, pb.sets, pa.sets, false) || {};
        return lsec(`세트 흐름 (지금 ${pa.sets}:${pb.sets}) · 그 스코어가 된 경기 중 이긴 비율`)
          + lrow(`이 스코어 최종 승률<span class="s">${fmtName(T)} · 지금 경기</span>`, fa.cur, fb.cur)
          + (fa.other || fb.other ? lrow(`<span class="s">${fmtName(OT)} 경기일 때</span>`, fa.other, fb.other) : ''); })() : '')
    + '</tbody></table>';
  // 요약: 키워드 칸 + 숫자 위주로 짧게 (이번 경기 에버·하이런 같은 건 아래 표에 있으니 시즌과 차이만)
  const pts = [], kw = t => `<span class="kw">${t}</span>`;
  // 세트 사이에는 홈피가 이번 세트 점수를 비워 준다
  pts.push(playing ? `${kw('지금')} ${esc(m.round || '')} ${setNo}세트 · 세트 <b>${pa.sets}:${pb.sets}</b> · <b>${pa.pts ?? 0}:${pb.pts ?? 0}</b> (${m.inning}이닝)${pa.turn || pb.turn ? ` · ${esc((pa.turn ? pa : pb).name)} 공격` : ''}`
    : `${kw('지금')} ${esc(m.round || '')} ${setNo}세트 시작 전 · 세트 <b>${pa.sets}:${pb.sets}</b>${m.cur_set && m.cur_set.first ? ` · 선공 ${esc(m.cur_set.first)}` : ''}`);
  if (done.length) pts.push(`${kw('끝난 세트')} ${done.map(s => `${setNum(s)}S ${s.pts[0]}:${s.pts[1]}<small>(${s.inn})</small>`).join(' · ')}`);
  for (const [p, d, o] of [[pa, da, pb], [pb, db, pa]]) {
    if (!d || !d.games) continue;
    const gs = d.games.filter(g => !g.single), cur = gs.filter(g => g.season === Math.max(...gs.map(x => x.season)));
    const bits = [];
    // 지금 세트 스코어에서 최종 승률: 지금 경기 세트제(통산 · 시즌) + 다른 세트제는 작게
    const first1 = p.sets === 1 && o.sets === 1 ? (done[0] && done[0].win[0] === (p === pa) ? '1:0' : '0:1') : null;
    const stOf = (TT, list) => p.sets < TT && o.sets < TT ? stateStats(list.filter(g => tgt(g) === TT))[stateKey(TT, p.sets, o.sets, first1)] : null;
    const st = stOf(T, gs), sc = stOf(T, cur), so = stOf(OT, gs);
    if (p.sets + o.sets > 0 && !(st && st.n) && so && so.n) bits.push(`${p.sets}:${o.sets}→승 <small>${T * 2 - 1}전 기록 없음 · ${OT * 2 - 1}전</small> 통산 <b>${pct(so.w / so.n)}</b><small>(${so.w}/${so.n})</small>`);
    if (p.sets + o.sets > 0 && st && st.n) bits.push(`${p.sets}:${o.sets}→승 <small>${T * 2 - 1}전</small> 통산 <b>${pct(st.w / st.n)}</b><small>(${st.w}/${st.n})</small>${sc && sc.n ? ` 시즌 <b>${pct(sc.w / sc.n)}</b><small>(${sc.w}/${sc.n})</small>` : ''}${so && so.n ? ` <small>· ${OT * 2 - 1}전 ${pct(so.w / so.n)}</small>` : ''}`);
    // 이번 세트 번호 승률 (통산 / 시즌)
    const bn = bySetNo(cur)[setNo], bt = bySetNo(gs)[setNo];
    if (bt && bt.n) bits.push(`${setNo}S 승률 ${pct(bt.w / bt.n)}${bn && bn.n ? `<small>(시즌 ${pct(bn.w / bn.n)})</small>` : ''}`);
    // 에버: 시즌보다 높은지 낮은지만
    const c = calc(cur);
    const G = p === pa ? GA : GB;
    if (G.avg != null && c.avg) bits.push(`에버 ${f3(G.avg)} <small>${G.avg >= c.avg ? '▲' : '▼'} 시즌 ${f3(c.avg)}</small>`);
    if (G.hr && c.hr && G.hr >= c.hr) bits.push(`<b>HR ${G.hr} 시즌 최고 타이·경신</b>`);
    // 맞대결 · 이번 대회
    const hh = gs.filter(g => g.opp === o.code);
    if (hh.length) { const w = hh.filter(g => g.win).length; bits.push(`상대 ${w}승 ${hh.length - w}패`); }
    const tg = gs.filter(g => g.tour === m.tour);
    if (tg.length) bits.push(tg.every(g => g.win) ? `대회 ${roundName(tg[0])}~${roundName(tg[tg.length - 1])} 전승` : `대회 ${tg.map(g => `${roundName(g)} ${g.win ? '승' : '패'}`).join(' · ')}`);
    pts.push(`${kw(esc(p.name))} ${bits.join(' · ')}`);
  }
  // 세트 포인트 근접
  const gp = 15;
  [pa, pb].forEach(p => { if (p.pts != null && gp - p.pts <= 3 && gp - p.pts > 0) pts.push(`${kw('세트 포인트')} <b>${esc(p.name)}</b> ${gp - p.pts}점 남음`); });
  return `<div class="lcard lsplit"><div class="lleft"><div class="lscore"><div class="pl a">${esc(pa.name)}${pa.turn ? ' <span class="turn">●</span>' : ''}</div>
    <div class="mid"><div class="sets">${pa.sets} : ${pb.sets}</div><div class="cur">${playing ? `<b>${pa.pts ?? 0} : ${pb.pts ?? 0}</b> · ${m.inning}이닝` : `${setNo}세트 시작 전`}</div></div>
    <div class="pl">${pb.turn ? '<span class="turn">●</span> ' : ''}${esc(pb.name)}</div></div>
    <div class="ldone">${esc(m.tour_name)} · ${esc(m.round || '')} · ${esc(m.table || '')}</div><ul>${pts.map(x => `<li>${x}</li>`).join('')}</ul><div class="tw">${liveTbl}</div></div>
    <div class="lright"><div class="lsub">기본 정보 · 이번 대회 · 이번 시즌 · 통산</div><div class="tw">${tbl}</div></div></div>`;
}
async function renderLive() {
  // LIVE 버튼 · 실시간 브리핑은 뺐다. 캐스터 버전의 기록지 버튼만 이 줄에 남는다
  const sheetB = window.Sheet && Sheet.on ? Sheet.btn() : '';
  // 기록지 버튼은 머리줄(탭 · 버튼 줄)에 둔다 — 따로 한 줄을 쓰지 않게
  $('#sheetSlot').innerHTML = sheetB;
  $('#live').innerHTML = '';
}
// 브리핑에서 경기를 열면 그 전 화면(두 칸의 선수)을 기억해 두었다가, 브리핑을 끄면 그 화면으로 돌아간다
// 앱을 켤 때는 항상 꺼진 상태로 시작한다 (LIVE 를 눌러야 30초 새로고침)
let livePrev = null;
$('#live').addEventListener('click', e => {
  if (e.target.closest('[data-loff]')) {
    liveOff = true;
    if (livePrev) { ['a', 'b'].forEach(k => livePrev[k] ? panes[k].load(livePrev[k]) : panes[k].clear()); livePrev = null; }
    pollLive(true); return;
  }
  if (e.target.closest('[data-lon]')) { liveOff = false; pollLive(); return; }
  const b = e.target.closest('[data-lv]'); if (!b) return;
  if (!livePrev) livePrev = { a: panes.a.data && panes.a.data.player.id, b: panes.b.data && panes.b.data.player.id };
  const [a, c] = b.dataset.lv.split('|'); panes.a.load(a); panes.b.load(c);
});
pollLive(true);

// 개인투어 / 팀리그 탭 전환 (마지막으로 본 탭을 기억)
function setApp(app) {
  closePop();
  document.body.classList.toggle('teammode', app === 'team');
  $('#teamApp').hidden = app !== 'team';
  document.querySelectorAll('.apptabs button').forEach(b => b.classList.toggle('on', b.dataset.app === app));
  if (app === 'team') { setBroadcast(false); if (window.TeamApp) TeamApp.show(); }
  else if (window.TeamApp) TeamApp.setBroadcast(false);
  if (app !== 'team' && indivStale) reloadIndiv();   // 팀리그 탭에 있는 동안 들어온 새 경기 결과
  localStorageSet('app', app);
  pollLive(true);   // 탭을 바꾸면 그 탭의 진행 중 경기를 바로 확인 (개인투어 · 팀리그는 따로 본다)
}
document.querySelector('.apptabs').addEventListener('click', e => { const b = e.target.closest('[data-app]'); if (b) setApp(b.dataset.app); });
</script>
