<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PBA 선수 비교</title>
<style>
:root {
  --bg: #f3f4f6; --panel: #ffffff; --ink: #1c2330; --sub: #6b7280; --line: #e3e6eb; --head: #0f2a4f;
  --accent: #1d5fd1; --win: #1a8f4c; --lose: #c4372f; --heat: 29, 95, 209; --gold: #c99a06; --silver: #8a94a3; --bronze: #b4693a;
  --zebra: #fafbfc; --chip: #eef2f8; --sticky: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1117; --panel: #161b22; --ink: #e6e9ee; --sub: #9aa4b2; --line: #2a313c; --head: #0a1d38;
    --accent: #6ea2ff; --win: #45c27c; --lose: #ff7a70; --heat: 110, 162, 255; --zebra: #1a2029; --chip: #222a36; --sticky: #161b22; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; display: flex; flex-direction: column; }
header.top { background: var(--head); color: #fff; padding: 8px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
header.top h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
header.top .meta { font-size: 12px; opacity: .7; margin-left: auto; }
#h2h, #th2h { background: var(--panel); border-bottom: 1px solid var(--line); }
#h2h:empty, #th2h:empty { display: none; }
#h2h summary, #th2h summary { cursor: pointer; padding: 10px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; list-style: none; }
#h2h summary::-webkit-details-marker, #th2h summary::-webkit-details-marker { display: none; }
#h2h .vs, #th2h .vs { font-weight: 700; font-size: 15px; }
#h2h .big, #th2h .big { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
#h2h .body, #th2h .body { max-height: 45vh; overflow: auto; padding: 0 16px 12px; }
.panes { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); min-height: 0; }
.pane { background: var(--bg); overflow: auto; min-width: 0; position: relative; }
.pane .search { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 12px; border-bottom: 1px solid var(--line); }
.search input { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 15px; }
.suggest { position: absolute; left: 12px; right: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15); max-height: 360px; overflow: auto; }
.suggest div { padding: 8px 12px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
.suggest div:hover, .suggest div.on { background: var(--chip); }
.suggest small { color: var(--sub); }
.empty { color: var(--sub); padding: 40px 20px; text-align: center; }
.card { background: var(--panel); margin: 10px 12px; border-radius: 10px; border: 1px solid var(--line); }
.profile { display: flex; flex-wrap: nowrap; gap: 12px; padding: 14px; align-items: flex-start; }
/* 이름 오른쪽 칸: 시즌 상금·포인트 순위, 누적 상금 순위 + 이번 시즌 대회별 성적. 칸이 좁으면 이름 아래로 내려간다 */
/* 왼쪽: 사진·이름 + 그 아래 필수 정보(남는 폭을 꽉 채움), 오른쪽: 순위 표(제 폭만) */
.pleft { flex: 1 1 0; min-width: 240px; display: flex; flex-direction: column; gap: 8px; }
.pid { display: flex; flex-wrap: nowrap; gap: 8px; align-items: flex-start; } .profile .who { white-space: nowrap; }
.pid > div:not(.rkchip) { min-width: 0; } .pid .rkchip { flex: none; }   /* 순위 칩은 항상 이름 옆 (이름 칸이 줄어듦) */
.pid h2, .pid .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pid .modes { flex-wrap: nowrap; white-space: nowrap; }   /* 짧은 이름(내 시즌·리그 평균)으로 한 줄 */
.pid .who + .who { font-size: 11px; letter-spacing: -.2px; }   /* 생년월일·만 나이 줄은 조금 작게 (잘리지 않게) */
.rkchip .rkh, .rkchip .rkg { justify-content: center; text-align: center; } .rkchip .rkg > div { align-items: center; }
@container (max-width: 360px) { .pid { flex-wrap: wrap; } }
.pid .who { font-size: 12.5px; line-height: 1.3; } .pid .who + .who { margin-top: 0; } .pid .modes { margin-top: 5px; }
/* 이번 시즌 상금·포인트 순위 칩 (이름과 순위 표 사이) */
.rkchip { margin-left: auto; background: var(--chip); border-radius: 8px; padding: 6px 10px; line-height: 1.25; }
.rkchip .rkh { font-size: 11.5px; color: var(--sub); font-weight: 600; white-space: nowrap; } .rkchip .rkh small { font-size: 10px; font-weight: 500; }
.rkchip .rkg { display: flex; align-items: flex-start; gap: 6px; margin-top: 2px; }
.rkchip .rkg > div { display: flex; flex-direction: column; } .rkchip .rkg i { font-style: normal; color: var(--sub); font-size: 15px; line-height: 21px; }
.rkchip .rkg b { font-size: 17px; font-weight: 800; white-space: nowrap; } .rkchip .rkg span { font-size: 11.5px; color: var(--sub); font-weight: 600; white-space: nowrap; }
/* '기본 기록' 제목 오른쪽 D-day */
.pleft .mtitle { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .pleft .mtitle .ddays { margin-top: 0; font-weight: 400; }
/* 선수 기록 질문 (이름 옆 🔍) */
.pcol { position: relative; flex: none; line-height: 0; }
.qabtn { position: absolute; right: 2px; bottom: 2px; font-size: 12px; line-height: 1; padding: 3px 4px; border-radius: 6px; border: 1px solid var(--line); background: rgba(20, 24, 32, .75); cursor: pointer; }
.qabtn.on, .qabtn:hover { border-color: var(--accent); background: rgba(var(--heat), .15); }
.card { position: relative; }
.qa { position: absolute; left: 10px; right: 10px; z-index: 40; padding: 10px; border: 1px solid var(--accent); border-radius: 10px; background: var(--panel); box-shadow: 0 12px 34px rgba(0, 0, 0, .45); max-height: 70vh; overflow: auto; }
.qa::before { content: ''; position: absolute; top: -7px; left: 40px; width: 12px; height: 12px; background: var(--panel); border-left: 1px solid var(--accent); border-top: 1px solid var(--accent); transform: rotate(45deg); }
table.qatab .qseq { letter-spacing: 1px; font-size: 11px; } table.qatab .qseq .w, table.qatab .qseq .l { font-weight: 700; }
.qaf { display: flex; gap: 6px; } .qaf input { flex: 1; min-width: 0; padding: 7px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 13px; }
.qaf button { padding: 6px 12px; border-radius: 7px; border: 0; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
.qaex { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; }
.qaex button, .qahelp button { font-size: 11px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--sub); cursor: pointer; margin: 2px; }
.qaex button:hover, .qahelp button:hover { color: var(--ink); border-color: var(--accent); }
.qaout:empty { display: none; } .qaout { margin-top: 8px; }
.qahead { font-size: 12px; color: var(--sub); margin-bottom: 3px; } .qahead b { color: var(--ink); }
.qasum { font-size: 13.5px; margin-bottom: 6px; line-height: 1.5; } .qahelp { font-size: 12.5px; color: var(--sub); line-height: 1.6; }
table.qatab { font-size: 12px; } table.qatab td { white-space: nowrap; }
/* 앱이 직접 그리는 말풍선 */
.rkbub { position: fixed; z-index: 99; pointer-events: none; background: color-mix(in srgb, var(--panel) 30%, transparent); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px; box-shadow: 0 8px 24px rgba(0, 0, 0, .28); font-size: 11px; color: var(--ink); }
.rkbub .rkh0 { font-weight: 800; font-size: 11.5px; margin-bottom: 3px; white-space: nowrap; } .rkbub .rkh0 small { color: var(--sub); font-weight: 500; margin-left: 3px; } .rkbub .rsub { font-weight: 600; font-size: 10.5px; color: var(--sub); }
.rkbub .cols { display: flex; gap: 10px; } .rkbub .rh { font-size: 10.5px; font-weight: 700; color: var(--sub); margin-bottom: 1px; }
.rkbub table { border-collapse: collapse; } .rkbub td { padding: 0 3px; line-height: 1.32; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rkbub td:first-child { text-align: right; color: var(--sub); padding-left: 0; } .rkbub td:last-child { text-align: right; font-weight: 700; padding-right: 0; }
.rkbub tr.me td { color: var(--accent); font-weight: 800; border-bottom: 1px solid var(--line); padding-bottom: 2px; } .rkbub tr.me + tr td { padding-top: 2px; }
.rkbub tr.mine:not(.me) td { color: var(--accent); font-weight: 800; }
.rkbub .rgames { font-size: 10.5px; line-height: 1.4; color: var(--ink); border-bottom: 1px solid var(--line); padding-bottom: 3px; margin-bottom: 3px; white-space: nowrap; }
.tipbox { position: fixed; z-index: 100; max-width: 320px; padding: 5px 9px; border-radius: 7px; background: #1f2633; color: #f1f4f8; font-size: 12px; line-height: 1.45; white-space: pre-line; box-shadow: 0 6px 20px rgba(0, 0, 0, .35); pointer-events: none; }
/* 팀리그 베스트 콤비 한 줄 · 다른 팀 조합 표시 · 남복/여복/혼복 구역 · 세트 흐름 왼쪽 칸 좁게 */
.bestcard .bestrow { flex-wrap: nowrap; gap: 5px; } .bestcard .bestrow .bl { min-width: 0; flex: none; font-weight: 700; } .bestcard .bestrow .bn { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bestcard .bestrow .pctb { margin-left: auto; flex: none; } .bestcard .bestrow .bw { margin-left: 0; flex: none; }
.ttag { font-size: 10px; font-weight: 800; margin-left: 3px; letter-spacing: -.3px; }
details.kdsec { margin-top: 10px; border-radius: 10px; border: 1px solid var(--line); border-left-width: 4px; padding: 0 0 4px; }
details.kdsec > summary { cursor: pointer; padding: 6px 10px; font-size: 13px; list-style: none; } details.kdsec > summary::before { content: '▾ '; color: var(--sub); } details.kdsec:not([open]) > summary::before { content: '▸ '; }
details.kdsec.kd남 { border-left-color: #3b82f6; } details.kdsec.kd여 { border-left-color: #d9649a; } details.kdsec.kd혼 { border-left-color: #a259e6; }
.flowtab table.grid th.lab { min-width: 0; padding-right: 4px; font-size: 12px; }
/* 리그 평균과의 차이 (작은 글씨) */
.dsm { font-size: .66em; margin-left: 3px; font-weight: 700; color: var(--sub); letter-spacing: -.2px; } .dsm.up { color: var(--win); } .dsm.dn { color: var(--lose); }
/* 약자: 넓으면 원래 약자, 좁은 이번 라운드 칸은 두 글자 */
.op .abs { display: none; }
@container (max-width: 420px) { .last5.rnd .op .abf { display: none; } .last5.rnd .op .abs { display: inline; } }
/* 팀원 줄 종목 칸: 단 · 복 · 혼 세 자리 고정 너비 */
/* 칸 너비는 가장 긴 값('복 13-11')이 들어가는 크기로 처음부터 고정 → 값이 길어도 서로 겹치지 않음 */
.prow .pk { font-size: 11.5px; --kw: 4.9em; display: grid !important; grid-template-columns: repeat(3, var(--kw)); gap: 3px; justify-content: end; }
.prow .kchip { text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 800; padding: 1px 0; border-radius: 5px; color: #f4f6fa; }
.prow .kchip i { font-weight: 700; margin-right: 3px; opacity: .9; color: inherit; }
/* 종목별 배경색: 단식 파랑 · 복식 초록 · 혼복 보라 */
.prow .kchip.k0 { background: rgba(59, 130, 246, .32); } .prow .kchip.k1 { background: rgba(16, 163, 104, .32); } .prow .kchip.k2 { background: rgba(162, 89, 230, .34); }
.prow .kchip.empty { background: transparent; }
@container (max-width: 420px) { .prow .pk { font-size: 10px; --kw: 4.75em; gap: 2px; } .prow .kchip { font-size: 10px !important; } .prow .kchip i { margin-right: 2px; } }
.prow { border-left: 1px solid transparent; border-right: 1px solid transparent; }   /* 대체 선수 줄(점선 테두리)과 칸 위치를 맞춤 */
/* 팀 이름은 늘 두 줄(회사 / 팀 이름), 로고는 이름 칸 높이에 맞춰 늘어난다 */
.teamid h2 .l1, .teamid h2 .l2 { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.teamid h2 { flex-direction: column; align-items: flex-start !important; justify-content: center; }
.teamid { --th: 106px; align-items: center !important; }   /* 로고 = 이름 칸(두 줄 이름 + 시즌 줄 + 버튼) 높이 */
@container (max-width: 620px) { .teamid { --th: 102px; } }
.teamid > .pcol img { width: var(--th) !important; height: var(--th) !important; }
.teamid > div:nth-child(2) { height: var(--th); display: flex; flex-direction: column; justify-content: center; }
/* 팀리그 1위: 진한 노란 볼드 · 팀 이름 상징색 */
.r1y, .tsr table.srank td.rk1 b { color: #ffd60a !important; font-weight: 900 !important; } .tcol { font-weight: 700; }
.prow .pn { min-width: 3.3em !important; }   /* 이름은 적어도 세 글자는 보이게 */
/* 기권·불참 표시 */
.enttip { cursor: help; text-decoration: underline dotted; text-underline-offset: 2px; } .rff { color: #e5534b; } .rabs { color: var(--sub); }
.tchip.rff, .res.rff { color: #e5534b; } .tchip.rabs, .res.rabs { color: var(--sub); opacity: .7; } .tchip.rabs { background: transparent; border: 1px dashed var(--line); }
/* 이번 시즌 대회별 성적: 1~5차 왼쪽, 6~10차 오른쪽 (세로로 5줄씩) */
.tseason { margin-top: 10px; }
.tseason .tsh { font-size: 12px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
.tchips.tcol { display: grid; grid-template-rows: repeat(5, auto); grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px 6px; margin-top: 0; }
.tchips.tcol .tchip { justify-content: space-between; }
/* 칸 폭 621~720px: 순위 표가 오른쪽에 있으면서 이름 칸이 좁은 구간 → 사진·이름·순위 칩을 조금 줄여 칩이 이름 옆에 남게 */
@container (min-width: 621px) and (max-width: 720px) { .pid { gap: 5px; } .profile .pid img { width: 58px; height: 73px; } .profile .pid h2 { font-size: 19px; } .pid .who { font-size: 11.5px; } .pid .modes button { font-size: 9px; padding: 1px 3px; } .rkchip { padding: 4px 6px; } .rkchip .rkg { gap: 4px; } .rkchip .rkg b { font-size: 14px; } .rkchip .rkg span { font-size: 10px; } .rkchip .rkh { font-size: 10px; } .rkchip .rkh small { display: none; } }
.pleft .must { padding: 0; }
.musttab td.rkclick { cursor: pointer; } .musttab td.rkclick:hover { outline: 1px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
.popbody table.games tr.gap td { text-align: center; color: var(--sub); padding: 0; }
.pleft .mtitle { font-size: 12.5px; font-weight: 800; color: var(--ink); margin-bottom: 2px; }
.musttab td small .dup { color: var(--win); font-weight: 700; } .musttab td small .ddn { color: var(--lose); font-weight: 700; }
.pleft .musth { font-size: 10px; font-weight: 500; margin: 3px 0 0; }
.pleft table.musttab th, .pleft table.musttab td { padding: 2px 2px; letter-spacing: -.2px; }
.pleft table.musttab thead th { font-size: 10.5px; } .pleft table.musttab tbody th { font-size: 11px; }
.pleft table.musttab td { font-size: 14px; } .pleft table.musttab thead th small, .pleft table.musttab td small { font-size: 9.5px; letter-spacing: -.2px; }
.profside { flex: 0 1 auto; width: min-content; min-width: 0; margin-left: auto; border-left: 1px solid var(--line); padding-left: 10px; }
/* 시즌별 순위 표 (윗줄) */
table.srank { border-collapse: collapse; font-size: 12px; white-space: nowrap; }
table.srank th, table.srank td { padding: 2px 1px; letter-spacing: -.2px; text-align: center; border-bottom: 1px solid var(--line); }
table.srank thead th { font-size: 11px; color: var(--sub); font-weight: 600; }
table.srank thead th.now { color: var(--ink); font-weight: 800; }
table.srank tbody th { text-align: left; color: var(--sub); font-weight: 600; font-size: 11.5px; }
table.srank td b { font-size: 12px; } table.srank td small { display: block; font-size: 9.5px; color: var(--sub); }
table.srank .tot { border-left: 1px solid var(--line); background: var(--chip); }
table.srank td.rk1 b { color: var(--gold); } table.srank td.rk2 b { color: var(--silver); } table.srank td.rk3 b { color: var(--bronze); } table.srank td.rk10 b { color: var(--accent); }
/* 순위 표 위 소속 띠: 팀 상징색, 이어진 시즌은 한 칸 */
table.srank tr.affil th { padding: 0 1px 2px; border-bottom: 0; }
table.srank .aff { display: block; border-radius: 4px; font-size: 10px; font-weight: 800; line-height: 15px; padding: 0 2px; white-space: nowrap; overflow: hidden; letter-spacing: -.3px; }
table.srank .aff.tour { background: var(--chip); color: var(--sub); border: 1px solid var(--line); line-height: 13px; }
table.srank .aff.sub { background: #4a5568; color: #fff; }
/* 이번 시즌 줄 (아랫줄): 상금·포인트 순위 + 대회별 성적 */
.pnow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.pnow .prk { flex: 0 0 auto; }
.pnow .tchips { margin-top: 0; flex: 1 1 260px; }
.prk { flex: 1 1 0; min-width: 104px; background: var(--chip); border-radius: 8px; padding: 6px 10px; display: flex; flex-direction: column; line-height: 1.25; }
.prk span { font-size: 11.5px; color: var(--sub); font-weight: 600; white-space: nowrap; }
.prk b { font-size: 20px; font-weight: 800; }
.prk small { font-size: 11px; color: var(--sub); white-space: nowrap; }
.tboxes { padding: 0 14px; }
.tboxes .tgames:first-child { margin-top: 0; }
@container (max-width: 620px) { .profile { flex-wrap: wrap; } .profside { flex-basis: 100%; width: auto; border-left: 0; padding-left: 0; margin-left: 0; } table.srank { width: 100%; } }
/* 아주 좁은 칸(절반 화면 등): 순위 표 글자·간격을 더 줄여 가로 스크롤 없이 */
@container (max-width: 380px) { .profile { padding: 10px; } .pleft { min-width: 0; } .profile .who { white-space: normal; } table.srank th, table.srank td { padding: 1px 0; letter-spacing: -.4px; } table.srank thead th { font-size: 9.5px; } table.srank tbody th { font-size: 10px; } table.srank td b { font-size: 10.5px; } table.srank td small { font-size: 8px; } }
@container (max-width: 320px) { table.srank td small { display: none; } }   /* 칸이 이보다 좁으면 순위만 보이고 금액·점수 줄은 숨김 */
.profile img { width: 72px; height: 90px; object-fit: cover; border-radius: 8px; background: var(--chip); }
.profile h2 { margin: 0 0 2px; font-size: 22px; }
.profile .who { color: var(--sub); font-size: 13px; }

<script>
'use strict';
// 화면 오류·느린 동작은 서버(data/app_ui.log)에 남긴다

window.addEventListener('unhandledrejection', e => uiLog(`오류(비동기): ${e.reason && (e.reason.stack || e.reason)} ${location.hash}`));
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// 정적 모드(휴대폰용 사이트, static_export.rb 가 window.PBA_STATIC 을 넣음): 서버 대신 data/ 파일에서 읽는다
//  실시간 브리핑 · 홈피 공식 순위처럼 그때그때 홈피에 물어봐야 하는 자료는 없음(null)

const api = p => STATIC ? staticApi(p) : fetch(p).then(r => r.json());

  const u = new URL(p, location.href), q = u.searchParams;
  switch (u.pathname.replace(/^.*\/api\//, '/api/')) {
    case '/api/search': { const s = (q.get('q') || '').replace(/\s/g, ''); return (staticPlayers || (staticPlayers = sjson('data/players.json' + stamp()))).then(l => l.filter(x => x.name.replace(/\s/g, '').includes(s)).slice(0, 20)); }
    case '/api/player': return sjson(`data/player/${q.get('id')}.json${stamp()}`);
    case '/api/league': return sjson(`data/league_${q.get('type')}.json${stamp()}`);
    case '/api/awards': return sjson(`data/awards_${q.get('type')}.json${stamp()}`);
    case '/api/team/all': return sjson('data/team_all.json' + stamp());
    case '/api/meta': return sjson('data/meta.json?t=' + Date.now()).then(m => { window.__metaBuilt = m.built; return m; });

  }
}
// 맞대결: 두 선수 파일에서 서로 만난 경기를 찾아 서버와 같은 모양으로 (상대 세트 기록 붙임)

  const [A, B] = await Promise.all([staticApi('/api/player?id=' + a), staticApi('/api/player?id=' + b)]);
  const theirs = Object.fromEntries(B.games.filter(g => g.opp === a).map(g => [g.pst, g]));
  return A.games.filter(g => g.opp === b).map(g => { const o = theirs[g.pst] || {}; return { ...g, opp_sets: o.sets, opp_avg: o.avg, opp_hr: o.hr, opp_tiebreak: o.tiebreak }; });
}
if (STATIC) document.documentElement.classList.add('static');

  return r;
};

// 대회 성적(results.result): '1'·'2'·'3' = 우승·준우승·3위, 숫자 = 그 라운드 탈락(8 → 8강), Q·PQ·PPQ, 서바이벌 시절은 'N위'
const RES_CLS = { 1: 'r1', 2: 'r2', 3: 'r3', 8: 'r8', 16: 'r16', 32: 'r32', 64: 'r64', 128: 'r128', 256: 'r128', Q: 'rq', PQ: 'rq', PPQ: 'rq' };
const resultClass = r => RES_CLS[r] || '';
const resultText = r => r === '1' ? '우승' : r === '2' ? '준우승' : r === '3' ? '3위' : /^\d+$/.test(r || '') ? `${r}강` : r;
// 상금 표 순위(공동 순위)를 대회 성적으로: 1 우승, 2 준우승, 3~4 3위, 5~8 8강, 9~16 16강 …
const rankToResult = n => !n ? '' : n === 1 ? '1' : n === 2 ? '2' : n <= 4 ? '3' : String(2 ** Math.ceil(Math.log2(n)));

const isForfeit = g => !(g.pts > 0 || (g.sets || []).some(s => s.opp_pts > 0));
const isPlayed = g => g.avg != null && g.inn > 0 && !isForfeit(g);
// 선수 자료를 받으면: games = 실제 친 경기(모든 기록 계산용), allGames = 기권 포함(경기 목록·투어 진행 상태용), forfeits = 기권만
function prepPlayer(d) {
  if (!d || d.allGames) return d;
  d.allGames = d.games; d.forfeits = d.games.filter(isForfeit); d.games = d.games.filter(g => !isForfeit(g));
  return d;
}
const ffText = (w, l) => w || l ? `기권 ${[w ? w + "승" : "", l ? l + "패" : ""].filter(Boolean).join(" ")}` : "";
function calc(gs) {
  const sg = gs.filter(g => !g.single);                   // 세트제 경기 (25점 단판 제외)

  const firsts = rec.filter(s => s.first && s.first_ball != null);

// 시즌별 표를 만든다. cols: [{label, games}] (마지막은 통산)
// mode: 'self' = 내 시즌끼리 비교(파랑), 'league' = 리그 평균 대비(초록/빨강). 리그 모드에선 맨 끝에 리그 평균 열.
function seasonTable(rows, cols, mode = 'self') {
  const calcs = cols.map(c => ({ ...calc(c.games), ...(c.extra || {}) }));
  calcs.forEach((o, i) => { o.dominance = dominanceOf(o, cols[i].league); ratioStats(o, cols[i].games, cols[i].league); });   // 게임 지배력은 그 열의 리그 평균이 있어야 계산된다
  const lg = mode === 'league' && cols[cols.length - 1].league;
  let h = '<div class="tw"><table class="grid"><thead><tr><th class="lab"></th>';
  cols.forEach((c, i) => h += `<th class="${i === cols.length - 1 ? 'tot' : ''}">${esc(c.label)}</th>`);
  if (lg) h += '<th class="lg">리그 평균</th>';
  h += '</tr></thead><tbody>';
  rows.forEach(([key, name, fmt, desc, sub, better]) => {
    h += `<tr><th class="lab"><abbr title="${esc(desc)}">${esc(name)}</abbr></th>`;
    const vals = calcs.map(o => key === 'wl' ? null : o[key]);
    const season = vals.slice(0, -1).filter(v => v != null && !isNaN(v) && isFinite(v));
    const lo = Math.min(...season), hi = Math.max(...season);
    const isRate = fmt === pct || fmt === f3 || fmt === f2 || fmt === f1;
    calcs.forEach((o, i) => {
      const last = i === cols.length - 1;
      let txt, style = '', cls = last ? 'tot' : '', diff = '';
      if (key === 'wl') txt = o.games || o.ffW || o.ffL ? `${o.win}-${o.lose}${o.ffW || o.ffL ? `<span class="s">${ffText(o.ffW, o.ffL)}</span>` : ''}` : '';
      else txt = fmt(o[key]);
      const v = o[key];
      if (mode === 'league') {
        const L = cols[i].league && cols[i].league[key];
        const c = isRate && !NO_LEAGUE.has(key) && txt ? vsLeague(v, L, fmt, better) : null;
        if (c) { cls += ' ' + c.cls; style = c.style; diff = `<span class="d">${c.txt}</span>`; }
      } else if (!last && isRate && season.length > 1 && v != null && hi > lo) {
        let t = (v - lo) / (hi - lo); if (better === 'low') t = 1 - t;
        style = `background: rgba(var(--heat), ${(0.06 + t * 0.32).toFixed(2)})`;
        if (t === 1) cls += ' best';
      }
      const s = key === 'tours' ? (o.entHtml ? `<span class="s">${o.entHtml}</span>` : '')   // 기권·불참: 항목마다 말풍선(어느 대회인지)
        : sub && o.games && (mode !== 'league' || NO_LEAGUE.has(key)) && sub(o) ? `<span class="s">${esc(sub(o))}</span>` : '';
      const tip = sub && o.games && key !== 'tours' ? ` title="${esc(sub(o))}"` : '';
      // 베스트·워스트 에버 칸: 누르면 그 경기 팝업 (pane 클릭 처리에서 data-gpst 로 찾음)
      const pg = key === 'bestAvg' ? o.bestG : key === 'worstAvg' ? o.worstG : null;
      const gp = pg ? ` data-gpst="${pg.pst}" data-gkind="${key === 'bestAvg' ? 'best' : 'worst'}" data-glabel="${esc(cols[i].label)}"` : '';
      h += `<td class="${cls}${pg ? ' gpop' : ''}" style="${style}"${tip}${gp}>${txt}${txt ? s + diff : ''}</td>`;
    });
    if (lg) h += `<td class="lg">${isRate && !NO_LEAGUE.has(key) ? fmt(lg[key]) : ''}</td>`;
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}

// 세트 스코어 상황별 승률 표 (경기 방식별로 묶음)
function stateTable(cols, mode) {
  const st = cols.map(c => stateStats(c.games));
  const Ts = [...new Set(cols[cols.length - 1].games.filter(g => !g.single).map(g => g.target).filter(t => t >= 3))].sort();
  const lgCol = mode === 'league' && cols[cols.length - 1].leagueStates;
  let h = '<div class="tw"><table class="grid"><thead><tr><th class="lab">스코어</th>' + cols.map((c, i) => `<th class="${i === cols.length - 1 ? 'tot' : ''}">${esc(c.label)}</th>`).join('') + (lgCol ? '<th class="lg">리그 평균</th>' : '') + '</tr></thead><tbody>';
  Ts.forEach(T => {
    h += `<tr class="grp"><th colspan="${cols.length + (lgCol ? 2 : 1)}">${FORMAT_NAME[T] || T + '세트 선승'}</th></tr>`;
    stateRows(T).forEach(([k, label, note]) => {
      const tot = st[st.length - 1][k];
      if (!tot) return;
      h += `<tr><th class="lab">${esc(label)}${note ? `<span class="s" style="font-weight:400">${esc(note)}</span>` : ''}</th>`;
      st.forEach((s, i) => {
        const o = s[k]; const last = i === cols.length - 1;
        if (!o) { h += `<td class="${last ? 'tot' : ''}"></td>`; return; }
        const v = o.w / o.n; let cls = last ? 'tot' : '', style = '', diff = '';
        if (mode === 'league') {
          const L = cols[i].leagueStates && cols[i].leagueStates[k];
          const c = L && L.n ? vsLeague(v, L.w / L.n, pct) : null;
          if (c && o.n >= 3) { cls += ' ' + c.cls; style = c.style; diff = `<span class="d">${c.txt}</span>`; }
        } else if (!last) style = `background: rgba(var(--heat), ${(0.05 + v * 0.33).toFixed(2)})`;
        h += `<td class="${cls}" style="${style}" title="${o.w}승 ${o.n - o.w}패">${pct(v)}<span class="s">${o.w}/${o.n}</span>${diff}</td>`;
      });
      if (lgCol) { const L = lgCol[k]; h += `<td class="lg">${L ? pct(L.w / L.n) : ''}</td>`; }
      h += '</tr>';
    });
  });
  return h + '</tbody></table></div>';
}

// ── 패널 ───────────────────────────────────────────────
const panes = {};
class Pane {
  constructor(el, key) {
    this.el = el; this.key = key; this.data = null;
    el.innerHTML = `<div class="search"><input placeholder="선수 이름 검색 (예: 강동궁)" autocomplete="off"><div class="suggest" hidden></div></div><div class="content"><div class="empty">선수를 검색하세요.<br><small>경기 목록에서 상대 이름을 누르면 반대쪽 화면에 열립니다.</small></div></div>`;
    this.input = $('input', el); this.sug = $('.suggest', el); this.content = $('.content', el);
    let timer, items = [], on = -1, seq = 0, pendingEnter = false;
    const show = () => { this.sug.hidden = !items.length; this.sug.innerHTML = items.map((p, i) => `<div data-i="${i}" class="${i === on ? 'on' : ''}"><b>${esc(p.name)}</b><small>${esc(p.type)} · ${esc(p.birth || '')} · ${p.n}경기${p.last ? ' · 최근 ' + seasonLabel(p.last) : ''}</small></div>`).join(''); };
    // 늦게 도착한 옛 검색 결과가 새 결과를 덮어쓰지 않도록 순번을 확인한다
    const search = async () => {
      const my = ++seq, q = this.input.value.trim();
      const r = q ? await api('/api/search?q=' + encodeURIComponent(q)) : [];
      if (my !== seq) return;
      items = r; on = items.length ? 0 : -1; show();
      if (pendingEnter) { pendingEnter = false; if (items[0]) pick(0); }
    };
    const pick = i => { const id = items[i].id; items = []; show(); this.input.blur(); this.load(id); };
    this.input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 100); });
    this.input.addEventListener('focus', () => this.input.select());
    this.input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { on = Math.min(on + 1, items.length - 1); show(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { on = Math.max(on - 1, 0); show(); e.preventDefault(); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        // 한글 조합 중이거나 검색 결과가 아직 없으면, 결과가 오는 대로 첫 선수를 연다
        if (e.isComposing || e.keyCode === 229 || !items[on]) { pendingEnter = true; clearTimeout(timer); setTimeout(search, 30); }
        else pick(on);
      }
      else if (e.key === 'Escape') { items = []; show(); }
    });
    this.sug.addEventListener('mousedown', e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); pick(+d.dataset.i); } });
    this.input.addEventListener('blur', () => setTimeout(() => { items = []; show(); }, 150));
    el.addEventListener('click', e => {
      if (e.target.closest('[data-qa]')) { this.setQa(!this.qaOpen); return; }
      // 말풍선 안에서 누를 수 있는 것(입력칸·버튼·선수 이름)이 아닌 곳, 또는 말풍선 밖을 누르면 닫힌다
      if (this.qaOpen) { const inQa = e.target.closest('.qa'); if (!inQa || !e.target.closest('input, button, .opp')) { this.setQa(false); if (inQa) return; } }
      const o = e.target.closest('[data-opp]'); if (o) { e.stopPropagation(); panes[this.key === 'a' ? 'b' : 'a'].load(o.dataset.opp); return; }
      // 시즌 대회별 순위 칸: 누르면 그 대회 라운드별 경기, 다시 누르면 닫힘 (한 번에 하나)
      const tc = e.target.closest('[data-tchip]');
      if (tc) {
        const code = tc.dataset.tchip, box = el.querySelector(`[data-tgames="${code}"]`), open = box && box.hidden;
        el.querySelectorAll('[data-tgames]').forEach(b => { b.hidden = true; }); el.querySelectorAll('[data-tchip]').forEach(c => c.classList.remove('on'));
        if (box && open) { box.hidden = false; tc.classList.add('on'); }
        return;
      }
      // 펼친 칩(시즌 대회별 칸)·육각형 말풍선: 누를 수 있는 곳이 아닌 데를 누르면 닫기만
      const openT = el.querySelector('[data-tgames]:not([hidden])'), openH = el.querySelector('.hexbub:not([hidden])');
      if ((openT || openH) && !e.target.closest(POP_CLICKABLE + ', [data-hex], [data-tchip], [data-gpst], tr.tourrow')) {
        if (openT) { el.querySelectorAll('[data-tgames]').forEach(b => { b.hidden = true; }); el.querySelectorAll('[data-tchip]').forEach(c => c.classList.remove('on')); }
        if (openH) openH.hidden = true;
        return;
      }
      const qx = e.target.closest('[data-qex]'); if (qx) { e.preventDefault(); this.ask(qx.dataset.qex); return; }
      // 펼친 세부 기록: 그 안의 누를 수 없는 곳을 누르면 접힌다 (팀리그와 같게)
      const sec = e.target.closest('.sec[data-sec]');
      if (sec && !e.target.closest(POP_CLICKABLE + ', [data-close], [data-hex], [data-gpst], [data-tchip], tr.tourrow, .rkclick, details')) { this.toggleSec(sec.dataset.sec); return; }
      const rkc = e.target.closest('[data-rank]');
      if (rkc) { this.openRankPop(rkc.dataset.rank); return; }
      const gp = e.target.closest('[data-gpst]');
      if (gp) { this.openGamePop(gp); return; }
      const kp = e.target.closest('[data-kpi]');
      if (kp) { this.openPop(kp); return; }
      const tl = e.target.closest('[data-tile]') || e.target.closest('[data-close]');
      if (tl) { this.toggleSec(tl.dataset.tile || tl.dataset.close); return; }
      const m = e.target.closest('[data-mode]'); if (m) { this.mode = m.dataset.mode; localStorageSet('mode_' + this.key, this.mode); this.render(); return; }
      const r = e.target.closest('tr.row'); if (r) { const d = r.nextElementSibling; d.hidden = !d.hidden; return; }
      const t = e.target.closest('tr.tourrow'); if (t) { const d = t.nextElementSibling; d.hidden = !d.hidden; }
    });
    // 기본 기록 칸 순위 말풍선: 커서를 올리면 그 칸 오른쪽에, 벗어나면 사라짐
    el.addEventListener('mouseover', e => { const c = e.target.closest('[data-rkh]'); if (!c || c === this._rkFor) return; this._rkFor = c; const h = this.rkBubble(c.dataset.rkh); if (h) showRkBub(c, h); });
    el.addEventListener('mouseout', e => { const c = e.target.closest('[data-rkh]'); if (c && !c.contains(e.relatedTarget)) { this._rkFor = null; hideRkBub(); } });
    this.mode = localStorageGet('mode_' + key) || 'self';
  }
  clear() {
    closePop(); this.loading = (this.loading || 0) + 1; this.data = null; this.input.value = '';
    this.content.innerHTML = `<div class="empty">선수를 검색하세요.<br><small>경기 목록에서 상대 이름을 누르면 반대쪽 화면에 열립니다.</small></div>`;
    saveHash(); renderH2H();
  }
  async load(id) {
    closePop();
    const my = this.loading = (this.loading || 0) + 1;
    this.content.innerHTML = '<div class="empty">불러오는 중…</div>';
    const d = prepPlayer(await api('/api/player?id=' + encodeURIComponent(id)));
    if (my !== this.loading) return;              // 그사이 다른 선수를 골랐으면 버린다
    if (!d) { this.content.innerHTML = '<div class="empty">선수를 찾지 못했습니다.</div>'; return; }
    if (!this.data || this.data.player.id !== d.player.id) { this.qaText = ''; this.qaHtml = ''; }
    this.data = d; this.input.value = d.player.name; this.league = null; this.official = null;
    this.render(); saveHash(); renderH2H(); if (window.pollLive) pollLive();
    // 공식 홈피(pbatour) 시즌 순위·기록: 늦게 와도 되니 기다리지 않고 받아지면 다시 그린다
    const oct = curTour(d);
    api(`/api/official?id=${encodeURIComponent(d.player.id)}&type=${encodeURIComponent(d.player.type)}&season=${lastSeason(d)}&tour=${oct ? oct.code : 0}`)
      .then(o => { if (my === this.loading && o && (o.rank || o.season)) { this.official = o; this.render(); } }).catch(() => {});
    this.league = await league(d.player.type);

  }
  render() {
    const { player: p, games, results, awards, tours } = this.data;
    const res = Object.fromEntries(results.map(r => [r.tour, r.result]));
    const tourById = Object.fromEntries(tours.map(t => [t.code, t]));
    const seasons = [...new Set(games.map(g => g.season))].sort();
    const bySeason = s => games.filter(g => g.season === s);
    const rc = (list, v) => list.filter(r => r.result === v).length;
    const seasonRes = s => results.filter(r => tourById[r.tour] && tourById[r.tour].season === s);
    const extra = list => ({ titles: rc(list, '1'), finals: rc(list, '2'), semis: rc(list, '3') });
    const ff = list => ({ ffW: list.filter(g => g.win).length, ffL: list.filter(g => !g.win).length });   // 기권승·기권패 (승-패 칸에 따로 표기)
    // 대회 출전: 그 시즌 시작한 대회마다 출전/기권/불참 (이 선수가 한 번이라도 명단에 오른 시즌만)
    const ent = ss => entryInfo(this.data, ss);
    const colSeasons = ordS(seasons);   // 표의 시즌 열 순서 (최신부터 / 과거부터)
    const cols = colSeasons.map(s => ({ label: seasonLabel(s), games: bySeason(s),
      extra: { ...extra(seasonRes(s)), ...ff(this.data.forfeits.filter(g => g.season === s)), ...ent([s]), awards: awards.filter(a => a.season === s).length } }));
    cols.push({ label: '통산', games, extra: { ...extra(results), ...ff(this.data.forfeits), ...ent(seasons), awards: awards.length } });
    const L = this.league;
    if (L) {
      colSeasons.forEach((s, i) => { cols[i].league = L.season[s]; cols[i].leagueStates = L.states[s]; });
      // 통산 열의 기준은 이 선수가 뛴 시즌들의 리그 기록 (이 선수 기간에 맞춘 평균)
      cols[cols.length - 1].league = L.all; cols[cols.length - 1].leagueStates = L.allStates;
    }
    const mode = this.mode;
    const all = calc(games), st = p.stats || {};
    const age = p.birth ? Math.floor((Date.now() - new Date(p.birth)) / 3.15576e10) : null;
    // 누르면 아래에 히스토리가 펼쳐지는 칸 (key 가 있는 칸만)
    // 두 항목을 묶은 칸: 왼쪽·오른쪽을 따로 누른다 ([값, 이름, 팝업 키])

    <table class="games"><thead><tr><th>#</th><th>에버</th><th>대회</th><th>상대</th><th>결과</th></tr></thead><tbody>${rank.slice(0, 5).map((x, i) => `<tr${x === g ? ' class="me"' : ''}>

      <td><span class="opp" data-opp="${esc(x.opp)}">${esc(x.opp_name)}</span></td><td><span class="${x.win ? 'w' : 'l'}">${x.win ? '승' : '패'} ${x.single ? (x.sets[0] ? x.sets[0].pts + '점' : '') : `${x.sw}:${x.sl}`}</span></td></tr>`).join('')}</tbody></table>`;
    this.showPop(`${label} ${best ? '베스트' : '워스트'} 에버`, f3(g.avg), h);
  }
  showPop(title, val, body, wide) {
    closePop();
    const r = this.el.getBoundingClientRect();
    const w = document.createElement('div');
    w.className = 'popwrap'; w._pane = this.el; w._wide = wide;   // 칸 위치가 바뀌면 따라간다 (syncPops). wide = 창 전체 폭(양쪽 나눠 보기)
    Object.assign(w.style, { left: (wide ? 0 : r.left) + 'px', top: r.top + 'px', width: (wide ? document.documentElement.clientWidth : r.width) + 'px', height: r.height + 'px' });
    w.innerHTML = `<div class="pop${wide ? ' wide' : ''}"><div class="pophead"><b>${esc(this.data.player.name)} · ${esc(title)}</b>
      <span class="popval">${esc(val)}</span><button class="popx" title="닫기 (Esc)">✕</button></div>
      <div class="popbody">${body}</div></div>`;
    w.addEventListener('click', e => {
      if (e.target === w || e.target.closest('.popx')) { closePop(); return; }
      if (!e.target.closest(POP_CLICKABLE)) { closePop(); return; }   // 누를 수 없는 곳을 누르면 닫힘
      const rr = e.target.closest('tr.row'); if (rr && !e.target.closest('[data-opp]')) { const d = rr.nextElementSibling; if (d) d.hidden = !d.hidden; return; }
      const o = e.target.closest('[data-opp]');
      if (o) { closePop(); panes[this.key === 'a' ? 'b' : 'a'].load(o.dataset.opp); }
    });
    document.body.appendChild(w);
  }
  // 웰컴톱랭킹 팝업 아래: 리그 전체 최다 수상자, 최고 에버, 에버 구간별·라운드별 비율
  async fillAwardLeague(w) {
    const type = this.data.player.type;
    const list = await (awardsCache[type] || (awardsCache[type] = api('/api/awards?type=' + encodeURIComponent(type))));
    const box = $('.awleague', w); if (!box || !list.length) return;
    const me = this.data.player.id, n = list.length;
    const who = a => `<span class="opp" data-opp="${esc(a.player)}"${a.player === me ? ' style="font-weight:800"' : ''}>${esc(a.player_name)}</span>`;
    const rn = a => a.round_raw ? roundName({ round_raw: a.round_raw, round_code: a.round_code, seq: a.seq }) : (a.round_desc === '준결승' ? '4강' : a.round_desc || '');
    const bar = (v, max) => `<span class="awbar"><i style="width:${(v / max * 100).toFixed(1)}%"></i></span>`;
    const tblR = (head, rows) => `<table class="games"><thead><tr>${head.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    // 최다 수상자 (같은 수상 횟수는 같은 순위)
    const cnt = Object.values(list.reduce((m, a) => { const o = m[a.player] || (m[a.player] = { a, n: 0, best: 0 }); o.n++; o.best = Math.max(o.best, a.avg); return m; }, {})).sort((x, y) => y.n - x.n || y.best - x.best);
    const rankOf = (arr, f) => arr.map((x, i) => i && f(arr[i - 1]) === f(x) ? null : i + 1).map((r, i, rs) => r ?? rs.slice(0, i).reverse().find(Boolean));
    const cr = rankOf(cnt, x => x.n);
    const topCnt = cnt.filter((x, i) => cr[i] <= 5);
    const myCnt = cnt.findIndex(x => x.a.player === me);
    // 최고 에버 TOP 5
    const topAvg = list.slice(0, 5);
    // 에버 구간 (0.5 단위)
    const bins = {};
    list.forEach(a => { const lo = Math.floor(a.avg / 0.5) * 0.5; bins[lo] = (bins[lo] || 0) + 1; });
    const binRows = Object.keys(bins).map(Number).sort((a, b) => b - a);
    const bmax = Math.max(...Object.values(bins));
    // 달성 라운드
    const ORDER = ['PPQ', 'PQ', 'Q', '128강', '64강', '조별리그', '32강', '16강', '8강', '4강', '결승'];
    const rc = list.reduce((m, a) => { const r = rn(a) || '기록 없음'; m[r] = (m[r] || 0) + 1; return m; }, {});
    const rRows = Object.keys(rc).sort((a, b) => (ORDER.indexOf(a) + 99) % 99 - (ORDER.indexOf(b) + 99) % 99);
    const rmax = Math.max(...Object.values(rc));
    box.innerHTML = `<div class="subhead" style="padding:14px 0 4px;font-weight:700;color:var(--ink)">${esc(type)} 역대 웰컴톱랭킹 <small style="font-weight:400;color:var(--sub)">(총 ${n}회 · 대회마다 한 명)</small></div>
      <div class="awgrid"><div><div class="subhead" style="padding:4px 0">최다 수상 TOP 5</div>
      ${tblR(['순위', '선수', '수상', '최고 에버'], topCnt.map((x, i) => [`${cr[i]}`, who(x.a), `<b>${x.n}회</b>`, f3(x.best)]))}
      ${myCnt >= 0 && cr[myCnt] > 5 ? `<div class="note">${esc(this.data.player.name)}: ${cr[myCnt]}위 (${cnt[myCnt].n}회)</div>` : ''}</div>
      <div><div class="subhead" style="padding:4px 0">최고 톱랭킹 에버 TOP 5</div>
      ${tblR(['#', '선수', '에버', '대회·라운드'], topAvg.map((a, i) => [`${i + 1}`, who(a), `<b>${f3(a.avg)}</b>`, `${esc(seasonLabel(a.season))} ${esc(tourShort(a.seq))} ${esc(rn(a))}<span class="s">vs ${esc(a.opp_name || '')} ${a.sw != null ? `${a.sw}:${a.sl}` : ''}</span>`]))}</div></div>
      <div class="awgrid"><div><div class="subhead" style="padding:8px 0 4px">에버 구간별 수상 비율</div>
      ${tblR(['구간', '수상', '비율', ''], binRows.map(lo => [`${lo.toFixed(1)} ~ ${(lo + 0.5).toFixed(1)}`, `${bins[lo]}회`, `<b>${pct(bins[lo] / n)}</b>`, bar(bins[lo], bmax)]))}</div>
      <div><div class="subhead" style="padding:8px 0 4px">달성 라운드 비율</div>
      <table class="games awround"><thead><tr><th>라운드</th><th>수상</th><th>비율</th><th></th></tr></thead><tbody>${rRows.map(r => {
        // 줄을 누르면 그 라운드에서 받은 수상 기록 (에버 높은 순): 선수 · 에버 · 시즌 · 대회 · 상대
        const won = list.filter(a => (rn(a) || '기록 없음') === r).sort((x, y) => y.avg - x.avg);
        return `<tr class="row"><td>${esc(r)} <span class="s" style="display:inline">▾</span></td><td>${rc[r]}회</td><td><b>${pct(rc[r] / n)}</b></td><td>${bar(rc[r], rmax)}</td></tr>
          <tr class="det" hidden><td colspan="4" style="padding:0"><table class="games awlist"><thead><tr><th>선수</th><th>에버</th><th>시즌</th><th>대회</th><th>상대 · 스코어</th></tr></thead><tbody>${won.map(a => `<tr${a.player === me ? ' class="me"' : ''}>
            <td>${who(a)}</td><td><b>${f3(a.avg)}</b></td><td>${esc(seasonLabel(a.season))}</td><td>${esc(tourShort(a.seq))} <span class="s" style="display:inline">${esc(a.tour_name || '')}</span></td>
            <td>${a.opp_name ? `vs ${esc(a.opp_name)}` : ''}${a.sw != null ? ` ${a.win ? '승' : '패'} ${a.sw}:${a.sl}` : ''}</td></tr>`).join('')}</tbody></table></td></tr>`;
      }).join('')}</tbody></table></div></div>
      <div class="note">구간은 0.5 단위 (예: 2.5 ~ 3.0 = 2.500 이상 3.000 미만). pbatour.org 공식 수상 기록 기준.</div>`;
  }
  // 기본정보 칸을 눌렀을 때 나오는 히스토리
  kpiDetail(key) {
    const { games, results, awards, tours, player: p } = this.data;
    const tourBy = Object.fromEntries(tours.map(t => [t.code, t]));
    const tl = t => t ? `${seasonLabel(t.season)} ${tourShort(t.seq)}` : '';
    const vs = g => g ? `<span class="opp" data-opp="${esc(g.opp)}">${esc(g.opp_name)}</span>` : '';
    const sc = g => g ? (g.single ? `${g.sets[0] ? g.sets[0].pts : ''}점` : `${g.sw}:${g.sl}`) : '';
    const where = g => `${esc(g.date || '')} · ${esc(seasonLabel(g.season))} ${esc(tourShort(g.seq))} ${esc(roundName(g))}`;
    // 세트 흐름: 승승패패패 (승부치기는 괄호)
    const setFlow = g => g && !g.single && g.sets ? `<span class="setflow">${g.sets.map(x => `<i class="${x.win ? 'w' : 'l'}">${x.win ? '승' : '패'}</i>`).join('')}${g.tiebreak ? `<i class="${g.tiebreak.win ? 'w' : 'l'}">(${g.tiebreak.win ? '승' : '패'})</i>` : ''}</span>` : '';
    const tbl = (head, rows) => rows.length
      ? `<table class="games"><thead><tr>${head.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`
      : '<div class="note">기록이 없습니다.</div>';
    const bySeason = (f, fmt, sub) => {
      const ss = [...new Set(games.map(g => g.season))].sort();
      return tbl(['시즌', '값', '기록'], ss.map(s => { const o = calc(games.filter(g => g.season === s)); return [seasonLabel(s), `<b>${fmt(f(o))}</b>`, sub(o)]; }));
    };
    // 입상 기록: 우승·준우승·4강 대회마다 마지막 경기 한 줄, 누르면 그 대회 전체 경기(라운드·상대·스코어·세트 점수·에버·HR)
    if (key === 'medal') {
      const MED = [['1', '🥇 우승'], ['2', '🥈 준우승'], ['3', '🥉 4강']];
      const all = this.data.allGames;
      const sum3 = MED.map(([r, n]) => `${n} <b>${results.filter(x => x.result === r).length}</b>`).join(' · ');
      return `<div class="note" style="margin-top:0">${sum3} · 줄을 누르면 그 대회 경기 전체가 펼쳐집니다</div>` + MED.map(([want, name]) => {
        const list = results.filter(r => r.result === want).map(r => tourBy[r.tour]).filter(Boolean).sort((a, b) => (b.end_date || '').localeCompare(a.end_date || ''));
        if (!list.length) return '';
        return `<div class="subhead">${name} ${list.length}회</div><table class="games medal"><thead><tr><th>시즌·투어</th><th>${want === '3' ? '4강' : '결승'} 상대</th><th>결과</th><th>대회 에버</th><th>경기</th></tr></thead><tbody>${list.map(t => {
          const tg = all.filter(g => g.tour === t.code), last = tg[tg.length - 1], o = calc(tg.filter(g => !isForfeit(g)));
          const rows = tg.map(g => isForfeit(g) ? `<tr class="ff"><td>${esc(roundName(g))}</td><td>${vs(g)}</td><td colspan="4"><span class="${g.win ? 'w' : 'l'}">${g.win ? '기권승' : '기권패'}</span></td></tr>`
            : `<tr><td>${esc(roundName(g))}</td><td>${vs(g)}</td><td><span class="${g.win ? 'w' : 'l'}">${g.win ? '승' : '패'} ${sc(g)}</span>${setFlow(g)}${g.tiebreak ? '<span class="tag">승부치기</span>' : ''}</td>
              <td class="ss">${g.single ? '' : (g.sets || []).map(x => `<span class="${x.win ? 'w' : 'l'}">${x.pts}${x.opp_pts != null ? ':' + x.opp_pts : ''}</span>`).join(' ')}</td><td>에버 <b>${f3(g.avg)}</b></td><td>HR ${g.hr ?? '–'}</td></tr>`).join('');
          return `<tr class="row"><td><b>${esc(tl(t))}</b><span class="s">${esc(t.name)} · ${esc(t.end_date || '')}</span></td><td>${last ? vs(last) : ''}</td>
            <td>${last ? `<span class="${last.win ? 'w' : 'l'}">${sc(last)}</span>${setFlow(last)}` : '<span class="s">기록 없음</span>'}</td><td><b>${f3(o.avg)}</b><span class="s">HR ${o.hr ?? '–'}</span></td><td>${o.win}승 ${o.lose}패 ▾</td></tr>
            <tr class="det" hidden><td colspan="5" style="padding:0"><table class="games tpath"><tbody>${rows}</tbody></table></td></tr>`;
        }).join('')}</tbody></table>`;
      }).join('');
    }
    // 그랜드 에버 = 총득점 ÷ 총이닝 (1:1 경기 전체, 25점 단판 포함·기권 제외), 시즌별 + 통산
    if (key === 'grand') {
      const ss = [...new Set(games.map(g => g.season))].sort((a, b) => b - a);
      const row = (lab, gs, strong) => { const pt = sum(gs, g => g.pts), inn = sum(gs, g => g.inn); return [strong ? `<b>${lab}</b>` : lab, `${pt.toLocaleString()}점`, `${inn.toLocaleString()}이닝`, `<b>${f3(inn ? pt / inn : null)}</b>`, `${gs.length}경기`]; };
      return tbl(['시즌', '총득점', '총이닝', '에버', ''], [row('통산', games, true), ...ss.map(s2 => row(seasonLabel(s2), games.filter(g => g.season === s2)))]) +
        `<div class="note">1:1 경기 기록 기준. 홈피 통산 그랜드 에버 ${f3(p.stats && p.stats.avg)}${p.stats && p.stats.innings ? ` (${(p.stats.p1 + 2 * p.stats.p2).toLocaleString()}점 / ${p.stats.innings.toLocaleString()}이닝)` : ''} — 홈피 값에는 서바이벌 경기도 들어가 조금 다를 수 있음.</div>`;
    }
    if (key === 'hrtop') {
      const top = games.filter(g => g.hr).sort((a, b) => b.hr - a.hr || b.avg - a.avg).slice(0, 5);
      return tbl(['#', '하이런', '대회', '상대', '결과'], top.map((g, i) => {
        const s2 = g.sets.find(x => x.set_hr === g.hr);
        return [`${i + 1}`, `<b>${g.hr}점</b>${s2 ? `<span class="s">${s2.no}세트</span>` : ''}`, `${esc(seasonLabel(g.season))} ${esc(tourShort(g.seq))} ${esc(roundName(g))}<span class="s">${esc(g.date || '')}</span>`, vs(g),
          `<span class="${g.win ? 'w' : 'l'}">${g.win ? '승' : '패'} ${sc(g)}</span><span class="s">에버 ${f3(g.avg)}</span>`];
      })) + `<div class="note">홈피 통산 하이런 ${p.stats && p.stats.hr != null ? p.stats.hr + '점' : '–'} (서바이벌·팀리그 포함이라 위 1위보다 높을 수 있음).</div>`;
    }
    // 에버 2.0+ / 1.0- : 시즌별 횟수·비율 + 해당 경기 (최근 순)
    if (key === 'avg20' || key === 'avg10') {
      const k = key === 'avg20' ? 'hi' : 'lo', ss = [...new Set(games.map(g => g.season))].sort((a, b) => b - a);
      const line = (lab, gs) => { const n = gs.filter(isPlayed).length, c = avgPick(gs, k).length; return [lab, `<b>${pct(n ? c / n : null)}</b>`, `${c}회 / ${n}경기`]; };
      const pick = avgPick(games, k).slice().reverse().slice(0, 15);
      return tbl(['시즌', '비율', '횟수'], [line('<b>통산</b>', games), ...ss.map(s2 => line(seasonLabel(s2), games.filter(g => g.season === s2)))]) +
        `<div class="subhead">해당 경기 (최근 ${pick.length}경기)</div>` + tbl(['에버', '대회', '상대', '결과'], pick.map(g => [`<b>${f3(g.avg)}</b>`, `${esc(seasonLabel(g.season))} ${esc(tourShort(g.seq))} ${esc(roundName(g))}<span class="s">${esc(g.date || '')}</span>`, vs(g), `<span class="${g.win ? 'w' : 'l'}">${g.win ? '승' : '패'} ${sc(g)}</span>`])) +
        `<div class="note">${k === 'hi' ? '한 경기 에버리지 2.000 이상' : '한 경기 에버리지 1.000 미만'}인 경기 비율 (1:1 경기 기록, 기권 경기 제외).</div>`;
    }
    // 묶은 칸 팝업: 시즌(최근 → 과거) 줄마다 두 항목을 나란히, 맨 위 통산
    if (key === 'winset' || key === 'bankfb') {
      const ss = [...new Set(games.map(g => g.season))].sort((a, b) => b - a);
      const cols = key === 'winset'
        ? [['경기 승률', o => o.winRate, o => `${o.win}승 ${o.lose}패`], ['세트 승률', o => o.setRate, o => `${o.setW}-${o.setL}`]]
        : [['뱅킹 승률', o => o.bankWinRate, o => `${o.bankWin}승 ${o.bankLose}패`], ['초구 성공률', o => o.fbSuccess, o => `${o.fbN}회 · 초에 ${f3(o.fbAvg)}`]];
      const row = (lab, gs) => { const o = calc(gs); return [lab, ...cols.map(([, v, sub]) => `<b>${pct(v(o))}</b><span class="s">${sub(o)}</span>`)]; };
      return tbl(['시즌', ...cols.map(c => c[0])], [row('<b>통산</b>', games), ...ss.map(s2 => row(seasonLabel(s2), games.filter(g => g.season === s2)))]);

    if (key === 'worst') {
      const low = games.filter(isPlayed).sort((a, b) => a.avg - b.avg).slice(0, 5);
      return tbl(['#', '에버', '대회', '상대', '결과', ''], low.map((g, i) => [`${i + 1}`, `<b>${f3(g.avg)}</b>`, `${esc(seasonLabel(g.season))} ${esc(tourShort(g.seq))} ${esc(roundName(g))}<span class="s">${esc(g.date || '')}</span>`, vs(g),
        `<span class="${g.win ? 'w' : 'l'}">${g.win ? '승' : '패'} ${sc(g)}</span>${g.single ? '<span class="tag">25점</span>' : ''}`, `HR ${g.hr ?? ''}`])) + '<div class="note">1:1 경기 기록 하위 5경기 (기권 경기 제외).</div>';
    }
    if (key === 'title' || key === 'final') {
      const want = key === 'title' ? '1' : '2';
      const list = results.filter(r => r.result === want).map(r => tourBy[r.tour]).filter(Boolean).sort((a, b) => (b.end_date || '').localeCompare(a.end_date || ''));
      return tbl(['시즌·투어', '결승 상대', '세트', '에버'], list.map(t => {
        const fin = games.filter(g => g.tour === t.code && (g.round_raw === '결승' || g.round_code === 2)).pop();

  // 라운드별 탈락 횟수: 대회마다 마지막 경기를 진 라운드. 아래 작은 글씨 = 그 라운드 에버, 그 기간 대회 중 비율. 마지막 줄은 우승
  roundTable(cols, mode) {
    const ORDER = ['PPQ', 'PQ', 'Q', '128강', '64강', '조별리그', '32강', '16강', '8강', '4강', '결승'];
    // 대회별 결과: { tour: '128강' | ... | '우승' }  (아직 이기고 올라가 있는 진행 중 대회는 뺌)
    const outOf = gs => {
      const by = {};
      gs.forEach(g => (by[g.tour] || (by[g.tour] = [])).push(g));
      const out = {};
      Object.entries(by).forEach(([t, ms]) => {
        const last = ms.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '') || a.pst - b.pst).pop();
        if (!last.win) out[t] = roundName(last);
        else if (roundName(last) === '결승') out[t] = '우승';
      });
      return out;
    };

    const rounds = ORDER.filter(r => have.has(r));
    // 라운드별 승률 · 에버리지 (그 라운드에서 치른 경기 전체)
    const played = ORDER.filter(r => cols.some(c => c.games.some(g => roundName(g) === r)));
    const thH = (extra = '') => cols.map((c, i) => `<th class="${i === cols.length - 1 ? 'tot' : ''}">${esc(c.label)}</th>`).join('') + extra;
    const lgOn = mode === 'league' && cols[cols.length - 1].league;

    let top = `<div class="subhead">라운드별 승률</div><div class="tw"><table class="grid"><thead><tr><th class="lab"></th>${thH()}</tr></thead><tbody>${played.map(r => `<tr><th class="lab">${esc(r)}</th>${cols.map((c, i) => { const gs = c.games.filter(g => roundName(g) === r), w = gs.filter(g => g.win).length; return `<td class="${i === cols.length - 1 ? 'tot' : ''}">${gs.length ? `${pct(w / gs.length)}<span class="s">${w}-${gs.length - w}</span>` : ''}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
    top += `<div class="subhead" style="margin-top:8px">라운드별 에버리지</div><div class="tw"><table class="grid"><thead><tr><th class="lab"></th>${thH(lgOn ? '<th class="lg">리그 평균</th>' : '')}</tr></thead><tbody>${played.map(r => `<tr><th class="lab">${esc(r)}</th>${cols.map((c, i) => { const gs = c.games.filter(g => roundName(g) === r), inn = sum(gs, g => g.inn), v = inn ? sum(gs, g => g.pts) / inn : null, x = mode === 'league' ? vsLeague(v, lgAvg(c.league, r), f3) : null; return `<td class="${i === cols.length - 1 ? 'tot' : ''}${x ? ' ' + x.cls : ''}" style="${x ? x.style : ''}">${v != null ? `${f3(v)}<span class="s">${gs.length}경기</span>${x ? `<span class="d">${x.txt}</span>` : ''}` : ''}</td>`; }).join('')}${lgOn ? `<td class="lg">${f3(lgAvg(cols[cols.length - 1].league, r))}</td>` : ''}</tr>`).join('')}</tbody></table></div><div class="subhead" style="margin-top:8px">라운드별 탈락 횟수</div>`;

    };

    if (have.has('우승')) line('우승', '우승', 'sumrow');
    return h + '</tbody></table></div><div class="note">숫자 = 그 라운드에서 탈락한 횟수. 작은 글씨 = 그 기간 출전 대회 중 비율. 진행 중인 대회에서 아직 살아 있으면 셈에서 뺍니다.</div>';

  // ── 세트 흐름: 스코어 분포, 승패 순서, 흐름 요약, 스코어 상황별 승률 (3전 2선승 경기는 뺌) ──
  flowSection(cols, mode) {

    let h = `<div class="subhead">세트 스코어 분포 <small>(횟수 · 그 시즌 경기 중 비율)</small></div><div class="tw"><table class="grid"><thead><tr><th class="lab"></th>${th}</tr></thead><tbody>`;

      return hn + dn.length ? (hw + dn.filter(q => q.won).length) / (hn + dn.length) : null;
    }
  };
  const triFb = (x, r, k, f = pct) => x ? [x.tour, x.now, x.all].map(o => {
    const v = fbMerge(o, r, k); if (v == null) return '';
    // 작은 글씨: 성공 / 전체 (지금 경기 몫은 괄호로)
    if (k === 'fbSuccess') return `${f(v)}<span class="s">${(o.fbHit || 0) + r.fbHit}/${(o.fbN || 0) + r.fb.length}${r.fb.length ? ` (지금 ${r.fbHit}/${r.fb.length})` : ''}</span>`;
    if (k === 'fbHitWin') {
      const dn = r.fb.filter(q => q.v > 0 && q.won != null);
      return `${f(v)}<span class="s">${(o.fbHitW || 0) + dn.filter(q => q.won).length}/${(o.fbHitN || 0) + dn.length}</span>`;
    }
    return f(v);
  }) : ['', '', ''];
  const fbPend = r => r.pendingNo ? `<span class="s">${r.pendingNo}세트 초구는 확인 중 (세트가 끝나면 반영)</span>` : '';
  const fbCell = (r, x) => (r.fb.length ? `<b>${r.fbHit}/${r.fb.length} 성공</b> (${pct(r.fbHit / r.fb.length)})<span class="s">${r.fb.map(q => `${q.no}세트 ${q.v}점${q.live ? '(진행 중)' : ''}`).join(' · ')}${x ? ` · 시즌 ${pct(x.now.fbSuccess)}` : ''}</span>` : (r.pendingNo ? '' : '<span class="s">선공 세트 없음</span>')) + fbPend(r);
  const cntCell = (n, tot, unit = '이닝') => tot ? `<b>${n}</b><span class="s">${tot}${unit} 중 ${pct(n / tot)}</span>` : '';
  const flowLine = i => m.cur_set && m.cur_set.runs && m.cur_set.runs[i] && m.cur_set.runs[i].length ? m.cur_set.runs[i].join(' ') : '';
  const ballName = b => b === 'white' ? '흰공(ㅎ)' : b === 'yellow' ? '노란공(ㄴ)' : '';
  const totPts = i => sum(done, x => x.pts[i] || 0) + ([pa, pb][i].pts || 0), totInn = sum(done, x => x.inn || 0) + (playing ? m.inning || 0 : 0);
  const vsSeason = (v, base, f) => v != null && base ? `<span class="s">시즌 ${f(base)} (${v >= base ? '+' : ''}${f(v - base)})</span>` : '';
  const curSet = p => playing ? `<b>${p.pts ?? 0}점</b>${p.turn ? ' <span class="atk">공격 중</span>' : ''}${p.turn && p.run ? `<span class="s">이번 이닝 연속 ${p.run}점</span>` : ''}` : '세트 사이';
  const setCell = (x, i) => { const r = x.runs && x.runs[i], n = r && r.length ? r.length : x.inn;   // 세트 에버 = 그 선수 이닝 기준
    return `${x.win[i] ? '<span class="atk">승</span> ' : ''}<b>${x.pts[i]}점</b><span class="s">${n}이닝 · 에버 ${n ? f3(x.pts[i] / n) : '–'}${r && r.length ? ` · HR ${Math.max(...r)}` : ''}${x.first === [pa, pb][i].name && r && r.length ? ` · 초구 ${r[0]}점` : ''}${x.bank && x.bank[i] ? ` · 뱅크 ${x.bank[i]}` : ''}</span>`; };
  // 왼쪽(실시간) 표: 선수 A | 항목 | 선수 B
  // 뱅크샷 성공 수 · 비율 칸 (비율 = 분자/분모, 작은 글씨로 시즌 값)
  const bankCell = r => r.inn ? `<b>${r.bank}개</b><span class="s">${r.bank * 2}점</span>` : '';
  const rateCell = (n, d, season, unit) => d ? `<b>${pct(n / d)}</b><span class="s">${n}/${d}${unit}${season != null ? ` · 시즌 ${pct(season)}` : ''}</span>` : '';
  // 지금 세트 에버 (실시간): 선공 선수는 지금 이닝까지, 후공 선수는 선공이 공격 중이면 한 이닝 덜 친 것으로
  const curAvgRow = () => {
    if (!playing || !m.inning) return '';
    const cell = p => { const n = curInn(p); return n > 0 ? `<b>${f3((p.pts || 0) / n)}</b><span class="s">${p.pts || 0}점 / ${n}이닝</span>` : ''; };
    return lrow(`${setNo}세트 에버<span class="s">지금 세트</span>`, cell(pa), cell(pb));
  };
  const lrow = (label, a, b) => `<tr><td class="one">${a || '–'}</td><th class="mid">${label}</th><td class="one">${b || '–'}</td></tr>`;
  const lsec = t => `<tr class="grp"><th colspan="3">${t}</th></tr>`;
  const nowRows = lsec(`이번 경기 · ${esc(m.round || '')} ${setNo}세트 ${playing ? `진행 중 (${m.inning}이닝)` : '시작 전'}`)
    + lrow('세트 스코어', `<b class="big">${pa.sets ?? 0}</b>`, `<b class="big">${pb.sets ?? 0}</b>`)
    + lrow(`지금 세트${playing ? ` (${m.inning}이닝)` : ''}${m.cur_set && m.cur_set.first ? `<span class="s">${setNo}세트 선공 ${esc(m.cur_set.first)}</span>` : ''}`, curSet(pa), curSet(pb))
    + (pa.ball || pb.ball ? lrow('공', ballName(pa.ball), ballName(pb.ball)) : '')
    + (curAvgRow())
    + lrow('게임 에버<span class="s">이번 경기 전체</span>', GA.avg != null ? `<b>${f3(GA.avg)}</b>${vsSeason(GA.avg, A && A.now.avg, f3)}` : '', GB.avg != null ? `<b>${f3(GB.avg)}</b>${vsSeason(GB.avg, B && B.now.avg, f3)}` : '')
    + lrow('이번 경기 하이런', `<b>${GA.hr}</b>${A && A.now.hr ? `<span class="s">시즌 최고 ${A.now.hr}</span>` : ''}`, `<b>${GB.hr}</b>${B && B.now.hr ? `<span class="s">시즌 최고 ${B.now.hr}</span>` : ''}`)
    + (GA.inn || GB.inn ? lrow('총 득점 · 이닝', `${GA.pts}점 / ${GA.inn}이닝`, `${GB.pts}점 / ${GB.inn}이닝`) : '')
    + (recSets.length ? lrow('이번 경기 초구', fbCell(RA, A), fbCell(RB, B))
      + lsec('기록지 · 끝난 세트 기준 (진행 중 세트는 세트가 끝나면 반영)')
      + lrow('뱅크샷 성공<span class="s">시도 횟수는 홈피에 기록 없음</span>', bankCell(RA), bankCell(RB))
      + lrow('뱅크샷 득점 비율', rateCell(RA.bank * 2, RA.pts, A && A.now.bank, '점'), rateCell(RB.bank * 2, RB.pts, B && B.now.bank, '점'))
      + lrow('장타율<span class="s">5점 이상 이닝</span>', rateCell(RA.long, RA.inn, A && A.now.long, '이닝'), rateCell(RB.long, RB.inn, B && B.now.long, '이닝'))
      + lrow('중타 (2~4점 이닝)', cntCell(RA.mid, RA.inn), cntCell(RB.mid, RB.inn))
      + lrow('무득점 이닝', cntCell(RA.zero, RA.inn), cntCell(RB.zero, RB.inn)) : '')
    + (playing && (flowLine(0) || flowLine(1)) ? lrow(`지금 세트 이닝별 득점${m.cur_set.first ? `<span class="s">선공 ${esc(m.cur_set.first)}</span>` : ''}`, flowLine(0), flowLine(1)) : '')
    + done.map(x => lrow(`${setNum(x)}세트${x.first ? `<span class="s">선공 ${esc(x.first)}</span>` : ''}`, setCell(x, 0), setCell(x, 1))).join('');
  let tbl = `<table class="grid ltab"><thead><tr><th colspan="3" class="nm">${esc(pa.name)}</th><th></th><th colspan="3" class="nm">${esc(pb.name)}</th></tr>
    <tr><th class="pt">이번 대회<small>${esc(tl(da))}</small></th><th class="ps">이번 시즌</th><th class="pa">통산</th><th></th><th class="pa">통산</th><th class="ps">이번 시즌</th><th class="pt">이번 대회<small>${esc(tl(db))}</small></th></tr></thead><tbody>`
    + sec('경기 전')
    + row1('상대 전적', hA.length ? `${hA.filter(g => g.win).length}승 ${hA.filter(g => !g.win).length}패` : '첫 맞대결', hB.length ? `${hB.filter(g => g.win).length}승 ${hB.filter(g => !g.win).length}패` : '첫 맞대결')
    + row('승-패', wl(A), wl(B))
    + row('에버리지', tri(A, 'avg', f3), tri(B, 'avg', f3))
    + row('하이런', tri(A, 'hr', int), tri(B, 'hr', int))
    + row('뱅킹 승률', tri(A, 'bankWinRate'), tri(B, 'bankWinRate'))
    + row1('상대전 뱅킹 승률', bankH(hA), bankH(hB))
    + row('흰공(ㅎ) 경기 승률', tri(A, 'whRate'), tri(B, 'whRate'))
    + row('노란공(ㄴ) 경기 승률', tri(A, 'yeRate'), tri(B, 'yeRate'))
    + row('초구 성공률<span class="s">지금 경기 포함</span>', triFb(A, RA, 'fbSuccess'), triFb(B, RB, 'fbSuccess'))
    + row('초구 에버<span class="s">지금 경기 포함</span>', triFb(A, RA, 'fbAvg', f3), triFb(B, RB, 'fbAvg', f3))
    + row('초구 다득점(2점+)<span class="s">지금 경기 포함</span>', triFb(A, RA, 'fbMulti'), triFb(B, RB, 'fbMulti'))
    + row('초구 성공 시 세트 승률<span class="s">지금 경기 끝난 세트 포함</span>', triFb(A, RA, 'fbHitWin'), triFb(B, RB, 'fbHitWin'))
    + sec(`${setNo}세트 시작 전 (${setNo}세트 에버 · 승률)`)
    + row(`${setNo}세트 기록`, setRec(A), setRec(B))
    + '</tbody></table>';
  const liveTbl = `<table class="grid ltab lnow"><thead><tr><th class="nm">${esc(pa.name)}</th><th></th><th class="nm">${esc(pb.name)}</th></tr></thead><tbody>${nowRows}`
    + (pa.sets + pb.sets > 0 ? (() => { const fa = flow(A, pa.sets, pb.sets, true) || {}, fb = flow(B, pb.sets, pa.sets, false) || {};
        return lsec(`세트 흐름 (지금 ${pa.sets}:${pb.sets}) · 그 스코어가 된 경기 중 이긴 비율`)
          + lrow(`이 스코어 최종 승률<span class="s">${fmtName(T)} · 지금 경기</span>`, fa.cur, fb.cur)
          + (fa.other || fb.other ? lrow(`<span class="s">${fmtName(OT)} 경기일 때</span>`, fa.other, fb.other) : ''); })() : '')
    + '</tbody></table>';
  // 요약: 키워드 칸 + 숫자 위주로 짧게 (이번 경기 에버·하이런 같은 건 아래 표에 있으니 시즌과 차이만)
  const pts = [], kw = t => `<span class="kw">${t}</span>`;
  // 세트 사이에는 홈피가 이번 세트 점수를 비워 준다
  pts.push(playing ? `${kw('지금')} ${esc(m.round || '')} ${setNo}세트 · 세트 <b>${pa.sets}:${pb.sets}</b> · <b>${pa.pts ?? 0}:${pb.pts ?? 0}</b> (${m.inning}이닝)${pa.turn || pb.turn ? ` · ${esc((pa.turn ? pa : pb).name)} 공격` : ''}`
    : `${kw('지금')} ${esc(m.round || '')} ${setNo}세트 시작 전 · 세트 <b>${pa.sets}:${pb.sets}</b>${m.cur_set && m.cur_set.first ? ` · 선공 ${esc(m.cur_set.first)}` : ''}`);
  if (done.length) pts.push(`${kw('끝난 세트')} ${done.map(s => `${setNum(s)}S ${s.pts[0]}:${s.pts[1]}<small>(${s.inn})</small>`).join(' · ')}`);
  for (const [p, d, o] of [[pa, da, pb], [pb, db, pa]]) {
    if (!d || !d.games) continue;
    const gs = d.games.filter(g => !g.single), cur = gs.filter(g => g.season === Math.max(...gs.map(x => x.season)));
    const bits = [];
    // 지금 세트 스코어에서 최종 승률: 지금 경기 세트제(통산 · 시즌) + 다른 세트제는 작게
    const first1 = p.sets === 1 && o.sets === 1 ? (done[0] && done[0].win[0] === (p === pa) ? '1:0' : '0:1') : null;
    const stOf = (TT, list) => p.sets < TT && o.sets < TT ? stateStats(list.filter(g => tgt(g) === TT))[stateKey(TT, p.sets, o.sets, first1)] : null;
    const st = stOf(T, gs), sc = stOf(T, cur), so = stOf(OT, gs);
    if (p.sets + o.sets > 0 && !(st && st.n) && so && so.n) bits.push(`${p.sets}:${o.sets}→승 <small>${T * 2 - 1}전 기록 없음 · ${OT * 2 - 1}전</small> 통산 <b>${pct(so.w / so.n)}</b><small>(${so.w}/${so.n})</small>`);
    if (p.sets + o.sets > 0 && st && st.n) bits.push(`${p.sets}:${o.sets}→승 <small>${T * 2 - 1}전</small> 통산 <b>${pct(st.w / st.n)}</b><small>(${st.w}/${st.n})</small>${sc && sc.n ? ` 시즌 <b>${pct(sc.w / sc.n)}</b><small>(${sc.w}/${sc.n})</small>` : ''}${so && so.n ? ` <small>· ${OT * 2 - 1}전 ${pct(so.w / so.n)}</small>` : ''}`);
    // 이번 세트 번호 승률 (통산 / 시즌)
    const bn = bySetNo(cur)[setNo], bt = bySetNo(gs)[setNo];
    if (bt && bt.n) bits.push(`${setNo}S 승률 ${pct(bt.w / bt.n)}${bn && bn.n ? `<small>(시즌 ${pct(bn.w / bn.n)})</small>` : ''}`);
    // 에버: 시즌보다 높은지 낮은지만
    const c = calc(cur);
    const G = p === pa ? GA : GB;
    if (G.avg != null && c.avg) bits.push(`에버 ${f3(G.avg)} <small>${G.avg >= c.avg ? '▲' : '▼'} 시즌 ${f3(c.avg)}</small>`);
    if (G.hr && c.hr && G.hr >= c.hr) bits.push(`<b>HR ${G.hr} 시즌 최고 타이·경신</b>`);
    // 맞대결 · 이번 대회
    const hh = gs.filter(g => g.opp === o.code);
    if (hh.length) { const w = hh.filter(g => g.win).length; bits.push(`상대 ${w}승 ${hh.length - w}패`); }
    const tg = gs.filter(g => g.tour === m.tour);
    if (tg.length) bits.push(tg.every(g => g.win) ? `대회 ${roundName(tg[0])}~${roundName(tg[tg.length - 1])} 전승` : `대회 ${tg.map(g => `${roundName(g)} ${g.win ? '승' : '패'}`).join(' · ')}`);
    pts.push(`${kw(esc(p.name))} ${bits.join(' · ')}`);
  }
  // 세트 포인트 근접
  const gp = 15;
  [pa, pb].forEach(p => { if (p.pts != null && gp - p.pts <= 3 && gp - p.pts > 0) pts.push(`${kw('세트 포인트')} <b>${esc(p.name)}</b> ${gp - p.pts}점 남음`); });
  return `<div class="lcard lsplit"><div class="lleft"><div class="lscore"><div class="pl a">${esc(pa.name)}${pa.turn ? ' <span class="turn">●</span>' : ''}</div>
    <div class="mid"><div class="sets">${pa.sets} : ${pb.sets}</div><div class="cur">${playing ? `<b>${pa.pts ?? 0} : ${pb.pts ?? 0}</b> · ${m.inning}이닝` : `${setNo}세트 시작 전`}</div></div>
    <div class="pl">${pb.turn ? '<span class="turn">●</span> ' : ''}${esc(pb.name)}</div></div>
    <div class="ldone">${esc(m.tour_name)} · ${esc(m.round || '')} · ${esc(m.table || '')}</div><ul>${pts.map(x => `<li>${x}</li>`).join('')}</ul><div class="tw">${liveTbl}</div></div>
    <div class="lright"><div class="lsub">기본 정보 · 이번 대회 · 이번 시즌 · 통산</div><div class="tw">${tbl}</div></div></div>`;
}
async function renderLive() {
  const el = $('#live');
  // 캐스터 버전: 진행 중 경기가 없어도 기록지 버튼이 보이게 한 줄은 남긴다
  const sheetB = window.Sheet && Sheet.on ? Sheet.btn() : '';
  const idle = () => { el.innerHTML = sheetB ? `<div class="lhead"><span class="onair dim">LIVE</span><span style="color:var(--sub)">진행 중 경기 없음</span>${sheetB}</div>` : ''; };
  if (!liveData) { idle(); return; }
  const teamMode = document.body.classList.contains('teammode');
  let cards = [], others = [];
  if (teamMode) {
    const sel = window.TeamApp && TeamApp.selected ? TeamApp.selected() : [];
    for (const m of liveData.team || []) {
      if (sel.includes(m.t1) || sel.includes(m.t2)) cards.push(window.TeamApp.liveBrief(m));
      else others.push(`<button disabled>${esc(m.teams.map(t => t.short).join(' vs '))} ${esc(m.teams.map(t => t.sets ?? '').join(':'))}</button>`);
    }
  } else {
    const sel = [panes.a.data, panes.b.data].filter(Boolean).map(d => d.player.id);
    for (const m of liveData.indiv || []) {
      if (m.players.some(p => sel.includes(p.code))) cards.push(await indivBrief(m));
      else others.push(`<button data-lv="${esc(m.players.map(p => p.code).join('|'))}">${esc(m.players[0].name)} ${m.players[0].sets}:${m.players[1].sets} ${esc(m.players[1].name)} <span style="color:var(--sub)">${esc(m.round || '')}</span></button>`);
    }
  }
  const n = teamMode ? (liveData.team || []).length : (liveData.indiv || []).length;
  if (!n) { idle(); return; }
  // 꺼 두면 한 줄 알림만 (진행 중 경기 수 + 다시 켜기)
  if (liveOff) { el.innerHTML = `<div class="lhead"><span class="onair dim" data-lon>LIVE</span><span style="color:var(--sub)">진행 중 ${n}경기 · 실시간 브리핑 꺼짐 (LIVE 를 누르면 켜집니다)</span>${sheetB}</div>`; return; }
  el.innerHTML = `<div class="lhead"><span class="onair" data-loff>LIVE</span><b>실시간 브리핑</b><span style="color:var(--sub)">${esc(liveData.at)} 기준 · 30초마다 새로고침</span>
    ${others.length ? `<span style="color:var(--sub)">· ${cards.length ? '다른 ' : ''}진행 중 경기:</span><span class="lother">${others.join('')}</span>` : ''}${sheetB}</div>${cards.join('')}`;
}
// 브리핑에서 경기를 열면 그 전 화면(두 칸의 선수)을 기억해 두었다가, 브리핑을 끄면 그 화면으로 돌아간다
// 앱을 켤 때는 항상 꺼진 상태로 시작한다 (LIVE 를 눌러야 30초 새로고침)
let livePrev = null;
$('#live').addEventListener('click', e => {
  if (e.target.closest('[data-loff]')) {
    liveOff = true;
    if (livePrev) { ['a', 'b'].forEach(k => livePrev[k] ? panes[k].load(livePrev[k]) : panes[k].clear()); livePrev = null; }
    pollLive(true); return;
  }
  if (e.target.closest('[data-lon]')) { liveOff = false; pollLive(); return; }
  const b = e.target.closest('[data-lv]'); if (!b) return;
  if (!livePrev) livePrev = { a: panes.a.data && panes.a.data.player.id, b: panes.b.data && panes.b.data.player.id };
  const [a, c] = b.dataset.lv.split('|'); panes.a.load(a); panes.b.load(c);
});
pollLive(true);

// 개인투어 / 팀리그 탭 전환 (마지막으로 본 탭을 기억)
function setApp(app) {
  closePop();
  document.body.classList.toggle('teammode', app === 'team');
  $('#teamApp').hidden = app !== 'team';
  document.querySelectorAll('.apptabs button').forEach(b => b.classList.toggle('on', b.dataset.app === app));
  if (app === 'team') { setBroadcast(false); if (window.TeamApp) TeamApp.show(); }
  else if (window.TeamApp) TeamApp.setBroadcast(false);
  localStorageSet('app', app);
  pollLive();
}
document.querySelector('.apptabs').addEventListener('click', e => { const b = e.target.closest('[data-app]'); if (b) setApp(b.dataset.app); });
</script>
